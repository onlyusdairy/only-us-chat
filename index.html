
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#160b13">
<title>Only Us — Private Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
:root{
 --bg:#100910;--panel:#1b101a;--panel2:#241521;
 --line:#382333;--pink:#ff6fae;--pink2:#e94791;
 --text:#fff1f7;--muted:#b99eae;--bubble:#30202e;
 --mine:#71304f;--danger:#ff7185;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:radial-gradient(ellipse at 15% 0%,#3a1830 0,transparent 38%),radial-gradient(ellipse at 100% 100%,#291324 0,transparent 35%),var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
button,input{font:inherit}
button{cursor:pointer;border:0;color:inherit}
.hidden{display:none!important}
.auth-wrap{min-height:100dvh;display:grid;place-items:center;padding:22px}
.auth-card{width:min(430px,100%);padding:34px;border:1px solid #ffffff18;background:#1b101ae8;backdrop-filter:blur(18px);border-radius:28px;box-shadow:0 18px 60px #0008}
.brand{font:700 34px 'Playfair Display',serif;text-align:center;color:#ffd2e5}
.brand span,.side-brand span{color:var(--pink)}
.tagline{text-align:center;color:var(--muted);margin:8px 0 26px;font-size:13px}
.field{display:block;width:100%;margin:10px 0;padding:14px 15px;border-radius:14px;border:1px solid var(--line);background:#100a11;color:var(--text);outline:none}
.field:focus{border-color:var(--pink)}
.password-wrap{position:relative;width:100%;margin:10px 0}
.password-wrap .field{margin:0;padding-right:72px}
.password-toggle{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:1px solid #ffffff18;border-radius:9px;background:#ffffff0b;color:#ffc4dc;padding:7px 9px;font-size:12px;font-weight:700}
.primary{background:linear-gradient(135deg,var(--pink),var(--pink2));color:#260d1b;font-weight:700;padding:13px 18px;border-radius:14px}
.primary:disabled{opacity:.5;cursor:wait}
.wide{width:100%;margin-top:8px}
.quiet{background:transparent;color:var(--muted);padding:10px}
.auth-links{display:flex;justify-content:space-between;margin-top:12px;font-size:13px}
.hint{color:var(--muted);font-size:12px;line-height:1.5}
.app{height:100dvh;max-width:1500px;margin:auto;padding:18px;display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px}
.sidebar,.chat-panel{min-height:0;border:1px solid #ffffff16;background:#1b101ae8;backdrop-filter:blur(18px);border-radius:25px;box-shadow:0 18px 60px #0008;overflow:hidden}
.sidebar{display:flex;flex-direction:column}
.side-head{padding:21px;border-bottom:1px solid var(--line)}
.side-brand{font:700 25px 'Playfair Display',serif}
.profile-row{display:flex;align-items:center;gap:11px;margin-top:17px}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#71304f,#e94791);display:grid;place-items:center;font-weight:700;color:white;flex:none}
.profile-meta{min-width:0;flex:1}
.profile-meta strong,.profile-meta small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-meta small{color:var(--muted);font-size:12px;margin-top:3px}
.icon-btn{width:36px;height:36px;border-radius:12px;background:#ffffff0c;color:#f4c5dc}
.icon-btn:hover{background:#ff6fae24}
.search{margin:14px 16px 8px}
.section-label{padding:10px 18px 5px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.5px}
.people-list{overflow:auto;padding:4px 10px}
.person{display:flex;align-items:center;gap:11px;padding:11px;border-radius:15px;cursor:pointer}
.person:hover,.person.active{background:#ff6fae16}
.person .avatar{width:40px;height:40px}
.person-info{min-width:0;flex:1}
.person-info b,.person-info small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person-info small{font-size:12px;color:var(--muted);margin-top:4px}
.friend-remove-btn{flex:none;width:30px;height:30px;border-radius:10px;background:#5a1d322e;color:#ff9aaa;font-size:20px}
.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:12px;display:flex;gap:8px}
.side-bottom button{flex:1;background:#ffffff0b;border-radius:12px;padding:11px 6px;font-size:12px}
.chat-panel{display:flex;flex-direction:column;position:relative}
.empty-state{margin:auto;text-align:center;color:var(--muted);padding:25px}
.empty-heart{font-size:52px}
.chat-head{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;min-height:75px}
.chat-head .profile-meta small{color:#ff9bc5}
.chat-actions{margin-left:auto;display:flex;gap:7px}
.mobile-back{display:none}
.messages{flex:1;min-height:0;overflow:auto;padding:22px clamp(12px,4vw,42px);display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.date-label{text-align:center;color:#967d8d;font-size:11px;margin:8px}
.message{max-width:min(72%,560px);align-self:flex-start;position:relative}
.message.mine{align-self:flex-end}
.bubble{padding:12px 14px;border-radius:18px 18px 18px 5px;background:var(--bubble);border:1px solid #ffffff0c;overflow-wrap:anywhere;line-height:1.45}
.mine .bubble{background:linear-gradient(135deg,#71304f,#54253e);border-radius:18px 18px 5px 18px}
.bubble.deleted{color:#d7b8c9;font-style:italic;background:#ffffff0a}
.bubble img{display:block;max-width:min(100%,330px);max-height:330px;object-fit:contain;border-radius:12px;margin-bottom:5px}
.msg-foot{display:flex;align-items:center;gap:8px;justify-content:flex-end;color:#bda2b2;font-size:10px;margin:4px 3px 0}
.msg-menu{background:transparent;color:#d6b5c7;font-size:18px;padding:2px 7px;border-radius:8px}
.msg-menu:hover{background:#ffffff18;color:white}
.reaction-row{display:flex;flex-wrap:wrap;gap:5px;margin:5px 2px 0}
.reaction-chip{border:1px solid #ffffff20;background:#ffffff0b;border-radius:999px;padding:3px 8px;font-size:12px;cursor:pointer}
.reaction-chip.mine{border-color:#ff6fae;background:#ff6fae25}
.message-menu-pop,.friend-menu-pop{position:fixed;z-index:99999;min-width:210px;max-width:min(290px,90vw);padding:10px;background:#241521;border:1px solid #ffffff2a;border-radius:16px;box-shadow:0 14px 45px #0009;display:grid;gap:7px;pointer-events:auto;isolation:isolate}
.reaction-picker{display:flex;justify-content:space-between;gap:3px;padding:4px 2px 8px;border-bottom:1px solid #ffffff18}
.reaction-picker button{background:transparent;border-radius:9px;padding:5px;font-size:22px;touch-action:manipulation}
.message-menu-pop .menu-action,.friend-menu-pop .menu-action{background:#ffffff0c;text-align:left;border-radius:10px;padding:11px;font-size:13px;touch-action:manipulation}
.message-menu-pop button:disabled{opacity:.5;cursor:wait}
.menu-action.delete{color:#ff9aaa}
.chat-compose{padding:14px 18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px;background:#180e18}
.compose-input{flex:1;min-width:0;background:#100a11;border:1px solid var(--line);border-radius:18px;padding:13px 15px;color:white;outline:none}
.send-btn{width:45px;height:45px;border-radius:15px;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#260d1b;font-size:18px;font-weight:bold}
.typing{font-size:11px;color:var(--pink);padding:0 25px 8px;min-height:18px}
.emoji-message{display:inline-block;font-size:1.9em;line-height:1.3}
.person-status{color:#ff9bc5}
.modal-bg{position:fixed;inset:0;background:#080408bb;display:grid;place-items:center;padding:18px;z-index:10000;backdrop-filter:blur(8px)}
.modal{width:min(440px,100%);max-height:90dvh;overflow:auto;background:#211421;border:1px solid #ffffff20;border-radius:23px;padding:23px}
.modal h2{font:700 23px 'Playfair Display',serif;margin:0 0 15px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.danger{background:#5a1d32;color:#ffdce7;padding:11px 14px;border-radius:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:100001;background:#311b2d;border:1px solid #ff6fae55;border-radius:14px;padding:12px 17px;box-shadow:0 18px 60px #0008;font-size:13px;max-width:90vw}
.float-hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.22}
.file-label{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#ffffff0b;cursor:pointer;font-size:18px}
@media(max-width:760px){
 .app{display:block;padding:7px;height:100dvh}
 .sidebar,.chat-panel{height:calc(100dvh - 14px);border-radius:20px}
 .chat-panel{display:none}
 .app.chat-open .sidebar{display:none}
 .app.chat-open .chat-panel{display:flex}
 .mobile-back{display:inline-flex}
 .side-head{padding:17px}
 .messages{padding:15px 11px}
 .message{max-width:88%}
 .chat-head{padding:12px}
 .chat-compose{padding:10px;gap:7px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
 .compose-input{padding:12px}
 .send-btn{width:43px;height:43px}
 .auth-card{padding:26px 21px}
}
</style>
</head>

<body>
<div id="authView" class="auth-wrap">
 <div class="auth-card">
  <div class="brand">Only <span>Us</span> ♡</div>
  <div class="tagline">A little space, just for your conversations.</div>
  <div id="authMessage" class="hint"></div>
  <input id="authEmail" class="field" type="email" autocomplete="email" placeholder="Email address">
  <input id="authPassword" class="field" type="password" autocomplete="current-password" placeholder="Password">
  <input id="authUsername" class="field hidden" maxlength="24" placeholder="Choose a username">
  <button id="authMain" class="primary wide">Log in</button>
  <div class="auth-links">
   <button id="authSwitch" class="quiet">Create account</button>
   <button id="forgotBtn" class="quiet">Forgot password?</button>
  </div>
  <div class="hint" style="text-align:center;margin-top:15px">Use a strong, unique password. Keep it private.</div>
 </div>
</div>

<div id="app" class="app hidden">
 <aside class="sidebar">
  <div class="side-head">
   <div class="side-brand">Only <span>Us</span> ♡</div>
   <div class="profile-row">
    <img id="myAvatar" class="avatar" alt="">
    <div class="profile-meta"><strong id="myName">Your profile</strong><small id="myHandle">@username</small></div>
    <button class="icon-btn" id="editProfile" title="Edit profile">✎</button>
   </div>
  </div>
  <input id="userSearch" class="field search" placeholder="Find people by username…">
  <div class="section-label">People & chats</div>
  <div id="peopleList" class="people-list"></div>
  <div class="section-label">Friend requests</div>
  <div id="requestsList" class="people-list" style="max-height:140px"></div>
  <div class="side-bottom">
   <button id="profilePhotoBtn">＋ Photo</button>
   <button id="logoutBtn">Log out</button>
  </div>
 </aside>

 <main class="chat-panel">
  <div class="float-hearts" id="floatHearts"></div>
  <div id="emptyState" class="empty-state">
   <div class="empty-heart">♡</div>
   <h2 style="font:700 25px 'Playfair Display',serif;color:#f7c8dc">Your little corner</h2>
   <p>Choose a chat or find someone to say hello.</p>
  </div>
  <div id="chatArea" class="hidden" style="display:flex;flex-direction:column;min-height:0;flex:1">
   <header class="chat-head">
    <button id="backBtn" class="icon-btn mobile-back">‹</button>
    <img id="peerAvatar" class="avatar" alt="">
    <div class="profile-meta"><strong id="peerName">Chat</strong><small id="peerStatus">Private conversation</small></div>
    <div class="chat-actions"><button id="deleteChatBtn" class="icon-btn" title="Hide chat from my list">⌫</button></div>
   </header>
   <div id="messages" class="messages"></div>
   <div id="typingStatus" class="typing"></div>
   <form id="composeForm" class="chat-compose">
    <label class="file-label" title="Send photo">＋<input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden></label>
    <input id="messageInput" class="compose-input" maxlength="4000" autocomplete="off" placeholder="Write a message…">
    <button class="send-btn" type="submit">➤</button>
   </form>
  </div>
 </main>
</div>

<div id="modalBg" class="modal-bg hidden">
 <div class="modal">
  <h2 id="modalTitle">Edit profile</h2>
  <div id="modalBody"></div>
  <div class="modal-actions">
   <button id="modalCancel" class="quiet">Cancel</button>
   <button id="modalSave" class="primary">Save</button>
  </div>
 </div>
</div>
<div id="toast" class="toast hidden"></div>

<script>
(()=>{
'use strict';

const SUPABASE_URL='https://vdmnhlwemcwdmwjfggzn.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_S19oIIHBfauqBpQXwgJsXw_yeZHBsBQ';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);

let user=null,profile=null,currentChat=null,peer=null;
let channel=null,typingChannel=null,presenceChannel=null;
let isSignup=false,modalAction=null,searchTimer=null;
let typingStopTimer=null,typingClearTimer=null,statusRefreshTimer=null;
let messageMenu=null,friendMenu=null,longPressTimer=null,messageLongPressTimer=null;
let friendLongPressTriggered=false;

const reactionChoices=['❤️','😂','😮','😢','😡','👍','🔥','🥰','😘','💋','😚'];

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

function toast(msg){
 $('toast').textContent=msg;
 $('toast').classList.remove('hidden');
 clearTimeout(toast.timer);
 toast.timer=setTimeout(()=>$('toast').classList.add('hidden'),3500);
}

function setBusy(el,busy,label){
 if(busy){
  el.dataset.old=el.textContent;
  el.disabled=true;
  el.textContent=label;
 }else{
  el.disabled=false;
  el.textContent=el.dataset.old||el.textContent;
 }
}

function initials(p){
 return esc((p?.display_name||p?.username||'?').slice(0,1).toUpperCase());
}

function fallbackImage(img,p){
 const letter=(p?.display_name||p?.username||'?').slice(0,1).toUpperCase();
 img.onerror=null;
 img.src='data:image/svg+xml,'+encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" rx="40" fill="#71304f"/><text x="50%" y="56%" font-size="32" text-anchor="middle" fill="white">${letter}</text></svg>`
 );
}

function avatarHTML(p){
 return p?.avatar_url
  ?`<img class="avatar" data-avatar-path="${esc(p.avatar_url)}" data-avatar-letter="${initials(p)}" alt="">`
  :`<div class="avatar">${initials(p)}</div>`;
}

async function signedAsset(path){
 if(!path)return '';
 if(/^https?:\/\//i.test(path))return path;
 const {data,error}=await db.storage.from('chat-photos').createSignedUrl(path,3600);
 if(error){console.warn(error.message);return ''}
 return data?.signedUrl||'';
}

async function hydrateAvatars(root=document){
 for(const img of root.querySelectorAll('[data-avatar-path]')){
  const url=await signedAsset(img.dataset.avatarPath);
  if(url){
   img.onerror=()=>fallbackImage(img,{display_name:img.dataset.avatarLetter});
   img.src=url;
  }else{
   const d=document.createElement('div');
   d.className='avatar';
   d.textContent=img.dataset.avatarLetter||'?';
   img.replaceWith(d);
  }
 }
}

function enhancePasswordFields(root=document){
 root.querySelectorAll('input[type="password"]').forEach(input=>{
  if(input.closest('.password-wrap'))return;
  const wrap=document.createElement('div');
  wrap.className='password-wrap';
  input.parentNode.insertBefore(wrap,input);
  wrap.appendChild(input);
  const toggle=document.createElement('button');
  toggle.type='button';
  toggle.className='password-toggle';
  toggle.textContent='Show';
  toggle.onclick=()=>{
   const show=input.type==='password';
   input.type=show?'text':'password';
   toggle.textContent=show?'Hide':'Show';
  };
  wrap.appendChild(toggle);
 });
}
enhancePasswordFields();

function openModal(title,body,action){
 $('modalTitle').textContent=title;
 $('modalBody').innerHTML=body;
 enhancePasswordFields($('modalBody'));
 modalAction=action;
 $('modalSave').classList.remove('hidden');
 $('modalBg').classList.remove('hidden');
}
function closeModal(){
 $('modalBg').classList.add('hidden');
 modalAction=null;
}
$('modalCancel').onclick=closeModal;
$('modalSave').onclick=async()=>{
 if(!modalAction)return;
 const b=$('modalSave');
 setBusy(b,true,'Saving…');
 try{await modalAction();closeModal()}
 catch(e){toast(e.message||'Could not save changes')}
 finally{setBusy(b,false)}
};

function authMode(signup){
 isSignup=signup;
 $('authUsername').classList.toggle('hidden',!signup);
 $('authMain').textContent=signup?'Create account':'Log in';
 $('authSwitch').textContent=signup?'I already have an account':'Create account';
 $('forgotBtn').classList.toggle('hidden',signup);
 $('authMessage').textContent='';
}
$('authSwitch').onclick=()=>authMode(!isSignup);

$('authMain').onclick=async()=>{
 const email=$('authEmail').value.trim();
 const password=$('authPassword').value;
 const username=$('authUsername').value.trim().toLowerCase();
 if(!email||!password)return toast('Enter email and password');
 if(isSignup&&!/^[a-z0-9_]{3,24}$/.test(username))return toast('Username: 3–24 letters, numbers or underscores');
 const b=$('authMain');
 setBusy(b,true,'Please wait…');
 try{
  if(isSignup){
   const {data,error}=await db.auth.signUp({email,password});
   if(error)throw error;
   if(data.user){
    const {error:pe}=await db.from('profiles').upsert({
     id:data.user.id,username,display_name:username
    },{onConflict:'id'});
    if(pe)throw pe;
   }
   toast('Account created. Log in if needed.');
  }else{
   const {error}=await db.auth.signInWithPassword({email,password});
   if(error)throw error;
  }
 }catch(e){toast(e.message)}
 finally{setBusy(b,false)}
};

$('forgotBtn').onclick=async()=>{
 const email=$('authEmail').value.trim();
 if(!email)return toast('Enter your email first');
 const {error}=await db.auth.resetPasswordForEmail(email,{
  redirectTo:location.origin+location.pathname
 });
 toast(error?error.message:'If the email is registered, a reset link has been sent.');
};

async function loadProfile(){
 const {data,error}=await db.from('profiles').select('*').eq('id',user.id).single();
 if(error)throw error;
 profile=data;
 $('myName').textContent=data.display_name||data.username;
 $('myHandle').textContent='@'+data.username;
 const url=await signedAsset(data.avatar_url);
 if(url){
  $('myAvatar').onerror=()=>fallbackImage($('myAvatar'),data);
  $('myAvatar').src=url;
 }else fallbackImage($('myAvatar'),data);
}

async function startApp(){
 const {data,error}=await db.auth.getUser();
 if(error)console.warn(error);
 user=data.user;
 if(!user){
  $('authView').classList.remove('hidden');
  $('app').classList.add('hidden');
  return;
 }
 try{
  await loadProfile();
  $('authView').classList.add('hidden');
  $('app').classList.remove('hidden');
  await Promise.all([loadPeople(),loadRequests()]);
  startPresence();
 }catch(e){toast('Profile setup: '+e.message)}
}

async function loadPeople(){
 try{
  const {data:accepted,error:ae}=await db.from('friend_requests')
   .select('sender_id,receiver_id')
   .eq('status','accepted')
   .or(`sender_id.eq.${user.id},receiver_id.eq.${user.id}`);
  if(ae)throw ae;

  const friendIds=[...new Set((accepted||[]).map(r=>
   r.sender_id===user.id?r.receiver_id:r.sender_id
  ).filter(Boolean))];

  if(!friendIds.length){
   window.__onlyUsPeople=[];
   window.__onlyUsFriendChats={};
   $('peopleList').innerHTML='<div class="hint" style="padding:10px">No friends yet. Search for a username above.</div>';
   return;
  }

  const {data:profiles,error:pe}=await db.from('profiles')
   .select('id,username,display_name,avatar_url,last_seen_at')
   .in('id',friendIds);
  if(pe)throw pe;

  const {data:myRows,error:me}=await db.from('conversation_members')
   .select('conversation_id')
   .eq('user_id',user.id);
  if(me)throw me;

  const myIds=[...new Set((myRows||[]).map(x=>x.conversation_id))];
  let peerRows=[];

  if(myIds.length){
   const {data,error}=await db.from('conversation_members')
    .select('conversation_id,user_id')
    .in('conversation_id',myIds)
    .in('user_id',friendIds);
   if(error)throw error;
   peerRows=data||[];
  }

  const shared={};
  peerRows.forEach(r=>{
   if(!shared[r.user_id])shared[r.user_id]=[];
   if(!shared[r.user_id].includes(r.conversation_id))shared[r.user_id].push(r.conversation_id);
  });

  const allIds=[...new Set(Object.values(shared).flat())];
  let latest={};

  if(allIds.length){
   const {data:msgs,error}=await db.from('messages')
    .select('conversation_id,created_at')
    .in('conversation_id',allIds)
    .order('created_at',{ascending:false});
   if(!error)(msgs||[]).forEach(m=>{
    if(!latest[m.conversation_id])latest[m.conversation_id]=m.created_at;
   });
  }

  const {data:hidden,error:he}=await db.from('hidden_conversations')
   .select('conversation_id').eq('user_id',user.id);
  if(he)throw he;
  const hiddenIds=new Set((hidden||[]).map(x=>x.conversation_id));

  const friendChats={};
  (profiles||[]).forEach(p=>{
   const chats=shared[p.id]||[];
   if(!chats.length)return;
   chats.sort((a,b)=>
    new Date(latest[b]||0)-new Date(latest[a]||0)
   );
   const chosen=chats.find(id=>!hiddenIds.has(id))||chats[0];
   friendChats[p.id]={...p,conversation_id:chosen,isHidden:hiddenIds.has(chosen)};
  });

  window.__onlyUsFriendChats=friendChats;
  window.__onlyUsPeople=Object.values(friendChats).filter(p=>!p.isHidden);

  $('peopleList').innerHTML=window.__onlyUsPeople.map(p=>`
   <div class="person" data-chat="${esc(p.conversation_id)}" data-peer="${esc(p.id)}">

    <div class="person-info">

  `).join('')||'<div class="hint" style="padding:10px">No visible chats. Search for a friend to reopen a hidden chat.</div>';

  await hydrateAvatars($('peopleList'));

 }catch(error){

  $('peopleList').innerHTML=`<div class="hint" style="padding:10px">Could not load friends: ${esc(error.message)}</div>`;
  throw error;
 }

async function openChat(chatId,peerId){
 const {error:unhideError}=await db.rpc('unhide_conversation_for_me',{
  p_conversation_id:chatId
 });
 if(unhideError)return toast(unhideError.message);

 const {data:p,error}=await db.from('profiles').select('*').eq('id',peerId).single();
 if(error)return toast(error.message);

 currentChat=chatId;
 peer=p;

 $('chatArea').classList.remove('hidden');
 $('app').classList.add('chat-open');

 $('peerName').textContent=p.display_name||p.username;
 $('peerStatus').textContent='Checking status…';

 const url=await signedAsset(p.avatar_url);
 if(url){
  $('peerAvatar').onerror=()=>fallbackImage($('peerAvatar'),p);
  $('peerAvatar').src=url;
 }else fallbackImage($('peerAvatar'),p);

async function loadMessages(){
 if(!currentChat)return;
 const chatAtStart=currentChat;

 const {data,error}=await db.from('messages')
  .select('id,conversation_id,sender_id,content,image_url,created_at,seen_at,deleted_at')
  .eq('conversation_id',chatAtStart).order('created_at',{ascending:true});
 if(error)return toast(error.message);

 const ids=(data||[]).map(m=>m.id);
 let hidden=new Set();

 if(ids.length){
  const {data:h,error:hideError}=await db.from('message_hidden')
   .select('message_id').eq('user_id',user.id).in('message_id',ids);
  if(!hideError)hidden=new Set((h||[]).map(x=>x.message_id));
 }

 const visible=(data||[]).filter(m=>!hidden.has(m.id));
 const visibleIds=visible.map(m=>m.id);
 let reactionMap={};

 if(visibleIds.length){
  const {data:rx,error:rxError}=await db.from('message_reactions')
   .select('message_id,user_id,emoji').in('message_id',visibleIds);
  if(!rxError)(rx||[]).forEach(r=>{
   (reactionMap[r.message_id]??=[]).push(r);
  });
 }

 const hydrated=await Promise.all(visible.map(async m=>{
  if(m.image_url&&!m.image_url.startsWith('http')){
   const {data:signed}=await db.storage.from('chat-photos').createSignedUrl(m.image_url,3600);
   return {...m,image_url:signed?.signedUrl||''};
  }
  return m;
 }));

 if(currentChat!==chatAtStart)return;

 $('messages').innerHTML=hydrated.map(m=>renderMessage(m,reactionMap[m.id]||[])).join('');
 $('messages').scrollTop=$('messages').scrollHeight;

 const unread=visible.filter(m=>
  m.sender_id!==user.id&&!m.seen_at&&!m.deleted_at
 ).map(m=>m.id);

 if(unread.length){
  await db.from('messages').update({seen_at:new Date().toISOString()}).in('id',unread);
 }
}

function renderMessage(m,reactions=[]){
 const mine=m.sender_id===user.id;
 const deleted=!!m.deleted_at;
 const time=new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
 const emojiOnly=!!m.content&&/^[\p{Extended_Pictographic}\uFE0F\u200D\s]+$/u.test(m.content);
 const messageText=m.content
  ?(emojiOnly?`<span class="emoji-message">${esc(m.content)}</span>`:esc(m.content).replace(/\n/g,'<br>'))
  :'';

 const content=deleted
  ?'<div class="bubble deleted">This message was deleted</div>'
  :`<div class="bubble">${m.image_url?`<img src="${esc(m.image_url)}" alt="Shared photo">`:''}${messageText}</div>`;

 const grouped={};
 reactions.forEach(r=>{
  grouped[r.emoji]??={count:0,mine:false};
  grouped[r.emoji].count++;
  if(r.user_id===user.id)grouped[r.emoji].mine=true;
 });

 const reactionHTML=Object.entries(grouped).map(([emoji,v])=>
  `<button type="button" class="reaction-chip ${v.mine?'mine':''}" data-react-msg="${m.id}" data-emoji="${esc(emoji)}">${emoji} ${v.count}</button>`
 ).join('');

 return `<div class="message ${mine?'mine':''}" data-message="${m.id}" data-deleted="${deleted}">
  ${content}
  ${reactionHTML?`<div class="reaction-row">${reactionHTML}</div>`:''}
  <div class="msg-foot">
   <span>${time}</span>
   ${mine&&!deleted?`<span>${m.seen_at?'Seen':'Sent'}</span>`:''}
   <button type="button" class="msg-menu" data-msgid="${m.id}" data-deleted="${deleted}">⋮</button>
  </div>
 </div>`;
}

function closeMessageMenu(){

function showMessageMenu(id,deleted,x,y){
 closeMessageMenu();
 if(deleted)return;

 const menu=document.createElement('div');
 menu.className='message-menu-pop';

 menu.innerHTML=`
  <div class="reaction-picker">
   ${reactionChoices.map(e=>`<button type="button" data-pick-emoji="${e}">${e}</button>`).join('')}
  </div>
  <button type="button" class="menu-action" data-menu-action="delete-me">Delete for me</button>
  <button type="button" class="menu-action delete" data-menu-action="delete-all">Delete for everyone</button>
 `;

 document.body.appendChild(menu);
 messageMenu=menu;

 const w=menu.offsetWidth,h=menu.offsetHeight;
 menu.style.left=Math.max(8,Math.min(x||20,innerWidth-w-8))+'px';
 menu.style.top=Math.max(8,Math.min(y||20,innerHeight-h-8))+'px';

 menu.addEventListener('click',async e=>{
  const react=e.target.closest('[data-pick-emoji]');
  const actionButton=e.target.closest('[data-menu-action]');
  if(!react&&!actionButton)return;

  e.preventDefault();
  e.stopPropagation();

  const buttons=[...menu.querySelectorAll('button')];
  buttons.forEach(b=>b.disabled=true);

  try{
   if(react){
    await toggleReaction(id,react.dataset.pickEmoji);
    closeMessageMenu();
    return;
   }

   const action=actionButton.dataset.menuAction;

   if(action==='delete-me'){
    actionButton.textContent='Deleting…';
    const {error}=await db.rpc('hide_message_for_me',{p_message_id:id});
    if(error)throw error;
    closeMessageMenu();
    await loadMessages();
    toast('Message deleted for you');
   }

   if(action==='delete-all'){
    if(!confirm('Delete this message for both people?')){
     buttons.forEach(b=>b.disabled=false);
     return;
    }
    actionButton.textContent='Deleting…';
    const {error}=await db.rpc('delete_message_for_everyone',{p_message_id:id});
    if(error)throw error;
    closeMessageMenu();
    await loadMessages();
    toast('Message deleted for everyone');
   }
  }catch(error){
   console.error('Message action error:',error);
   toast(error.message||'Action failed');
   buttons.forEach(b=>b.disabled=false);
  }
 });
}

async function toggleReaction(messageId,emoji){
 try{
  const {data:existing,error:findError}=await db.from('message_reactions')
   .select('id')
   .eq('message_id',messageId)
   .eq('user_id',user.id)
   .eq('emoji',emoji)
   .maybeSingle();

  if(findError)throw findError;

  if(existing){
   const {error}=await db.from('message_reactions')
    .delete().eq('id',existing.id).eq('user_id',user.id);
   if(error)throw error;
  }else{
   const {error}=await db.from('message_reactions').insert({
    message_id:messageId,user_id:user.id,emoji
   });
   if(error)throw error;
  }

  await loadMessages();
 }catch(error){
  console.error('Reaction error:',error);
  toast(error.message||'Could not send reaction');
 }
}

/* REALTIME */

function subscribeChat(){
 if(channel)db.removeChannel(channel);
 channel=db.channel('chat-'+currentChat)
  .on('postgres_changes',{
   event:'*',schema:'public',table:'messages',
   filter:'conversation_id=eq.'+currentChat
  },()=>loadMessages())
  .on('postgres_changes',{
   event:'*',schema:'public',table:'message_reactions'
  },()=>loadMessages())
  .subscribe();

 if(typingChannel)db.removeChannel(typingChannel);
 typingChannel=db.channel('typing-'+currentChat)
  .on('broadcast',{event:'typing'},({payload})=>{
   if(payload?.user_id===user.id)return;
   $('typingStatus').textContent=payload?.typing?'Typing…':'';
   clearTimeout(typingClearTimer);
   if(payload?.typing)typingClearTimer=setTimeout(()=>$('typingStatus').textContent='',2500);
  }).subscribe();
}

function emitTyping(value){
 if(typingChannel)typingChannel.send({
  type:'broadcast',event:'typing',
  payload:{user_id:user.id,typing:value}
 });
}

/* PRESENCE */

function onlineUserIds(){
 const state=presenceChannel?.presenceState?.()||{};
 const ids=new Set();
 Object.entries(state).forEach(([key,metas])=>
  (metas||[]).forEach(meta=>ids.add(meta.user_id||key))
 );
 return ids;
}

function relativeSeen(value){
 if(!value)return 'Last seen recently';
 const secs=Math.max(0,Math.floor((Date.now()-new Date(value).getTime())/1000));
 if(secs<60)return 'Seen now';
 if(secs<3600)return `Seen ${Math.floor(secs/60)}m ago`;
 if(secs<86400)return `Seen ${Math.floor(secs/3600)}h ago`;
 return `Seen ${Math.floor(secs/86400)}d ago`;
}

function refreshPresenceLabels(){
 const online=onlineUserIds();
 document.querySelectorAll('[data-person-status]').forEach(el=>{
  const p=(window.__onlyUsPeople||[]).find(x=>x.id===el.dataset.personStatus);
  el.textContent=online.has(el.dataset.personStatus)?'Online':relativeSeen(p?.last_seen_at);
 });
 if(peer)$('peerStatus').textContent=online.has(peer.id)?'Online':relativeSeen(peer.last_seen_at);
}

async function startPresence(){
 if(presenceChannel)db.removeChannel(presenceChannel);
 presenceChannel=db.channel('presence-global',{
  config:{presence:{key:user.id}}
 });

 presenceChannel
  .on('presence',{event:'sync'},refreshPresenceLabels)
  .on('presence',{event:'join'},refreshPresenceLabels)
  .on('presence',{event:'leave'},refreshPresenceLabels);

 presenceChannel.subscribe(async status=>{
  if(status==='SUBSCRIBED'){
   await presenceChannel.track({
    user_id:user.id,online_at:new Date().toISOString()
   });
   refreshPresenceLabels();
  }
 });

 if(statusRefreshTimer)clearInterval(statusRefreshTimer);
 statusRefreshTimer=setInterval(()=>{
  refreshPresenceLabels();
  if(currentChat)loadMessages();
 },15000);

 document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='hidden'){
   await db.from('profiles').update({last_seen_at:new Date().toISOString()}).eq('id',user.id);
   if(presenceChannel)await presenceChannel.untrack();
  }else if(presenceChannel){
   await presenceChannel.track({user_id:user.id,online_at:new Date().toISOString()});
   await db.from('profiles').update({last_seen_at:new Date().toISOString()}).eq('id',user.id);
  }
 });
}

/* PASSWORD RESET */

db.auth.onAuthStateChange((event,session)=>{
 if(event==='PASSWORD_RECOVERY'){
  openModal(
   'Set a new password',
   '<input id="resetPass" class="field" type="password" placeholder="New password"><input id="resetPass2" class="field" type="password" placeholder="Confirm new password">',
   async()=>{
    const a=$('resetPass').value;
    const b=$('resetPass2').value;
    if(a.length<8||a!==b)throw Error('Passwords must match and be at least 8 characters');
    const {error}=await db.auth.updateUser({password:a});
    if(error)throw error;
    toast('Password updated');
   }
  );
 }
});

startApp();

})();
</script>
