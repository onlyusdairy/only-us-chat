
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Only Us ❤️</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  color:white;
  min-height:100vh;
  background:radial-gradient(circle at top,#64152f,#250817 55%,#10040b);
  overflow-x:hidden;
}
.hearts{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.heart{
  position:absolute;bottom:-60px;
  color:#ff5b9d;
  text-shadow:0 0 10px #ff2674,0 0 25px #ff2674;
  animation:float 14s linear infinite;
}
@keyframes float{
  0%{transform:translateY(0) rotate(0);opacity:0}
  15%{opacity:.85}
  85%{opacity:.65}
  100%{transform:translateY(-115vh) rotate(35deg);opacity:0}
}
.container{position:relative;z-index:1;width:min(92%,650px);margin:auto;padding:35px 0}
header{text-align:center;margin-bottom:25px}
.logo{
  font-size:38px;width:75px;height:75px;
  display:grid;place-items:center;margin:auto auto 12px;
  border-radius:24px;
  background:linear-gradient(135deg,#ff315d,#ff72b5);
  box-shadow:0 0 30px #ff367b99;
}
h1{font-size:38px;margin:0;text-shadow:0 0 20px #ff4c91}
header p{color:#f5b5cf}
.panel{
  background:#260c1ddd;
  border:1px solid #ff6aa54d;
  border-radius:22px;padding:24px;
  box-shadow:0 15px 50px #0008,0 0 25px #ff347b20;
  backdrop-filter:blur(12px);
}
.tabs{display:flex;gap:10px;margin-bottom:20px}
button{
  border:0;border-radius:12px;padding:13px 18px;
  color:white;background:#651c3c;
  cursor:pointer;font-weight:bold;
}
button.active,.send,.main-btn{
  background:linear-gradient(100deg,#e72d5e,#ff65aa);
}
.tabs button{flex:1}
label{display:block;color:#f7c0d5;font-size:13px;margin:12px 0 6px}
input{
  width:100%;padding:14px;border-radius:11px;
  border:1px solid #a94470;background:#170913;
  color:white;outline:none;
}
input:focus{border-color:#ff70ad;box-shadow:0 0 0 3px #ff4f9922}
.main-btn{width:100%;margin-top:18px}
.note{font-size:12px;color:#d8a5bb;line-height:1.6}
.hidden{display:none!important}
#chatScreen{margin-top:20px}
.chat-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chat-top h2{font-size:22px}
.messages{
  height:390px;overflow-y:auto;padding:14px;
  border-radius:14px;background:#160711;
  border:1px solid #ff5a9b44;margin:15px 0;
}
.message{
  max-width:85%;width:max-content;
  background:#64203f;padding:11px 14px;
  border-radius:15px;margin:9px 0;
  overflow-wrap:anywhere;
}
.message.mine{margin-left:auto;background:#b52c61}
.message small{display:block;color:#ffd0e2;font-size:10px;margin-top:6px}
.message img{display:block;max-width:100%;max-height:220px;border-radius:10px;margin-top:8px}
.composer{display:flex;gap:8px;align-items:center}
.composer input{min-width:0}
.photo-btn{font-size:20px;padding:12px}
#photo{display:none}
.status{font-size:12px;color:#ffc0d8;margin-top:10px;min-height:18px}
footer{text-align:center;color:#d89ab5;font-size:12px;margin-top:25px}
@media(max-width:450px){
  .panel{padding:17px}
  h1{font-size:32px}
  .messages{height:55vh}
}
</style>
</head>

<body>
<div class="hearts" id="hearts"></div>

<div class="container">
<header>
  <div class="logo">❤️</div>
  <h1>Only Us</h1>
  <p>A little world made for two ✨</p>
</header>

<!-- LOGIN -->
<section class="panel" id="loginScreen">
  <div class="tabs">
    <button class="active" id="loginTab">Login</button>
    <button id="signupTab">Create Account</button>
  </div>

  <form id="accountForm">
    <div id="nameField" class="hidden">
      <label>Your Name</label>
      <input id="name" placeholder="Enter your name">
    </div>

    <label>Email or Username</label>
    <input id="username" required placeholder="Enter email or username">

    <label>Password</label>
    <input id="password" type="password" required placeholder="Enter password">

    <button class="main-btn" id="accountButton" type="submit">Login</button>
  </form>

  <p class="note">
    This is a local demo. Real private accounts and online chatting
    will be enabled after Firebase setup.
  </p>
  <div class="status" id="loginStatus"></div>
</section>

<!-- CHAT -->
<section class="panel hidden" id="chatScreen">
  <div class="chat-top">
    <h2>Our Chat ❤️</h2>
    <button id="logout">Logout</button>
  </div>

  <div class="messages" id="messages"></div>

  <form class="composer" id="messageForm">
    <label class="photo-btn" for="photo">📷</label>
    <input type="file" id="photo" accept="image/*">
    <input id="messageInput" placeholder="Write something..." maxlength="1000">
    <button class="send">Send</button>
  </form>
  <div class="status" id="chatStatus"></div>
</section>

<footer>Made with ❤️ • Only Us</footer>
</div>

<script>
// Floating hearts animation
const heartLayer=document.getElementById("hearts");
for(let i=0;i<25;i++){
  const heart=document.createElement("span");
  heart.className="heart";
  heart.textContent=["♥","♡","❤"][i%3];
  heart.style.left=Math.random()*100+"%";
  heart.style.fontSize=(15+Math.random()*25)+"px";
  heart.style.animationDuration=(12+Math.random()*15)+"s";
  heart.style.animationDelay=(-Math.random()*20)+"s";
  heartLayer.appendChild(heart);
}

// Demo account system (browser only)
let signupMode=false;
let currentUser=null;

const accounts=JSON.parse(localStorage.getItem("onlyUsAccounts")||"[]");
const loginScreen=document.getElementById("loginScreen");
const chatScreen=document.getElementById("chatScreen");

function saveAccounts(){
  localStorage.setItem("onlyUsAccounts",JSON.stringify(accounts));
}

document.getElementById("loginTab").onclick=()=>{
  signupMode=false;
  document.getElementById("loginTab").classList.add("active");
  document.getElementById("signupTab").classList.remove("active");
  document.getElementById("nameField").classList.add("hidden");
  document.getElementById("accountButton").textContent="Login";
  document.getElementById("loginStatus").textContent="";
};

document.getElementById("signupTab").onclick=()=>{
  signupMode=true;
  document.getElementById("signupTab").classList.add("active");
  document.getElementById("loginTab").classList.remove("active");
  document.getElementById("nameField").classList.remove("hidden");
  document.getElementById("accountButton").textContent="Create Account";
  document.getElementById("loginStatus").textContent="";
};

document.getElementById("accountForm").onsubmit=e=>{
  e.preventDefault();

  const username=document.getElementById("username").value.trim().toLowerCase();
  const password=document.getElementById("password").value;
  const name=document.getElementById("name").value.trim()||username;

  if(signupMode){
    if(accounts.some(a=>a.username===username)){
      document.getElementById("loginStatus").textContent="Account already exists!";
      return;
    }
    accounts.push({username,password,name});
    saveAccounts();
    document.getElementById("loginStatus").textContent="Account created! Now login.";
    document.getElementById("loginTab").click();
  }else{
    const account=accounts.find(a=>a.username===username&&a.password===password);
    if(!account){
      document.getElementById("loginStatus").textContent="Wrong username or password.";
      return;
    }
    currentUser=account;
    openChat();
  }
};

function openChat(){
  loginScreen.classList.add("hidden");
  chatScreen.classList.remove("hidden");
  showMessages();
}

document.getElementById("logout").onclick=()=>{
  currentUser=null;
  chatScreen.classList.add("hidden");
  loginScreen.classList.remove("hidden");
};

function showMessages(){
  const messages=JSON.parse(localStorage.getItem("onlyUsMessages")||"[]");
  const box=document.getElementById("messages");
  box.innerHTML="";

  messages.forEach(m=>{
    const div=document.createElement("div");
    div.className="message"+(m.username===currentUser.username?" mine":"");

    const sender=document.createElement("strong");
    sender.textContent=m.name;
    div.appendChild(sender);

    if(m.text){
      const text=document.createElement("div");
      text.textContent=m.text;
      div.appendChild(text);
    }

    if(m.photo){
      const img=document.createElement("img");
      img.src=m.photo;
      img.alt="Shared photo";
      div.appendChild(img);
    }

    const time=document.createElement("small");
    time.textContent=m.time;
    div.appendChild(time);
    box.appendChild(div);
  });
  box.scrollTop=box.scrollHeight;
}

document.getElementById("messageForm").onsubmit=async e=>{
  e.preventDefault();
  const text=document.getElementById("messageInput").value.trim();
  const file=document.getElementById("photo").files[0];

  if(!text&&!file)return;

  let photo="";
  if(file){
    if(file.size>1500000){
      document.getElementById("chatStatus").textContent="Demo photo limit is 1.5 MB.";
      return;
    }
    photo=await new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve(reader.result);
      reader.onerror=reject;
      reader.readAsDataURL(file);
    });
  }

  const messages=JSON.parse(localStorage.getItem("onlyUsMessages")||"[]");
  messages.push({
    username:currentUser.username,
    name:currentUser.name,
    text,photo,
    time:new Date().toLocaleString()
  });

  localStorage.setItem("onlyUsMessages",JSON.stringify(messages));
  document.getElementById("messageInput").value="";
  document.getElementById("photo").value="";
  document.getElementById("chatStatus").textContent="";
  showMessages();
};
</script>
</body>
</html>
