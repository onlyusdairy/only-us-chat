<body>
<div id="authView" class="auth-wrap"><div class="auth-card"><div class="brand">Only <span>Us</span> ♡</div><div class="tagline">A little space, just for your conversations.</div><div id="authMessage" class="hint"></div><input id="authEmail" class="field" type="email" autocomplete="email" placeholder="Email address"><input id="authPassword" class="field" type="password" autocomplete="current-password" placeholder="Password"><input id="authUsername" class="field hidden" maxlength="24" placeholder="Choose a username"><button id="authMain" class="primary wide">Log in</button><div class="auth-links"><button id="authSwitch" class="quiet">Create account</button><button id="forgotBtn" class="quiet">Forgot password?</button></div><div class="hint" style="text-align:center;margin-top:15px">Use a strong, unique password. Keep it private.</div></div></div>

<script>
(()=>{
'use strict';
const SUPABASE_URL='https://vdmnhlwemcwdmwjfggzn.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_S19oIIHBfauqBpQXwgJsXw_yeZHBsBQ';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
let user=null,profile=null,currentChat=null,peer=null,channel=null,typingChannel=null,presenceChannel=null,isSignup=false,modalAction=null,searchTimer=null,typingStopTimer=null,typingClearTimer=null,statusRefreshTimer=null;
let messageMenu=null,friendMenu=null,longPressTimer=null,friendLongPressTriggered=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.add('hidden'),3000)}
function setBusy(el,busy,label){el.disabled=busy;if(busy)el.dataset.old=el.textContent;el.textContent=busy?label:(el.dataset.old||el.textContent)}
function initials(p){return esc((p?.display_name||p?.username||'?').slice(0,1).toUpperCase())}
function fallbackImage(img,p){const letter=(p?.display_name||p?.username||'?').slice(0,1).toUpperCase();img.onerror=null;img.src='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" rx="40" fill="#71304f"/><text x="50%" y="56%" font-size="32" text-anchor="middle" fill="white">${letter}</text></svg>`)}
function avatarHTML(p){return p?.avatar_url?`<img class="avatar" data-avatar-path="${esc(p.avatar_url)}" data-avatar-letter="${initials(p)}" alt="">`:`<div class="avatar">${initials(p)}</div>`}
async function signedAsset(path){if(!path)return '';if(/^https?:\/\//i.test(path))return path;const {data,error}=await db.storage.from('chat-photos').createSignedUrl(path,3600);if(error){console.warn('Image URL error:',error.message);return ''}return data?.signedUrl||''}
async function hydrateAvatars(root=document){for(const img of root.querySelectorAll('[data-avatar-path]')){const url=await signedAsset(img.dataset.avatarPath);if(url){img.onerror=()=>{const d=document.createElement('div');d.className='avatar';d.textContent=img.dataset.avatarLetter||'?';img.replaceWith(d)};img.src=url}else{const d=document.createElement('div');d.className='avatar';d.textContent=img.dataset.avatarLetter||'?';img.replaceWith(d)}}}
function relativeSeen(value){if(!value)return 'Last seen recently';const secs=Math.max(0,Math.floor((Date.now()-new Date(value).getTime())/1000));if(secs<60)return 'Seen now';if(secs<3600)return `Seen ${Math.floor(secs/60)}m ago`;if(secs<86400)return `Seen ${Math.floor(secs/3600)}h ago`;return `Seen ${Math.floor(secs/86400)}d ago`}
function onlineUserIds(){const state=presenceChannel?.presenceState?.()||{};const ids=new Set();Object.entries(state).forEach(([key,metas])=>(metas||[]).forEach(meta=>ids.add(meta.user_id||key)));return ids}
function refreshPresenceLabels(){const online=onlineUserIds();document.querySelectorAll('[data-person-status]').forEach(el=>{const p=(window.__onlyUsPeople||[]).find(x=>x.id===el.dataset.personStatus);el.textContent=online.has(el.dataset.personStatus)?'Online':relativeSeen(p?.last_seen_at)});if(peer)$('peerStatus').textContent=online.has(peer.id)?'Online':relativeSeen(peer.last_seen_at)}
function enhancePasswordFields(root=document){root.querySelectorAll('input[type="password"]').forEach(input=>{if(input.closest('.password-wrap'))return;const wrap=document.createElement('div');wrap.className='password-wrap';input.parentNode.insertBefore(wrap,input);wrap.appendChild(input);const toggle=document.createElement('button');toggle.type='button';toggle.className='password-toggle';toggle.textContent='Show';toggle.setAttribute('aria-label','Show password');toggle.setAttribute('aria-pressed','false');toggle.addEventListener('click',()=>{const show=input.type==='password';input.type=show?'text':'password';toggle.textContent=show?'Hide':'Show';toggle.setAttribute('aria-label',show?'Hide password':'Show password');toggle.setAttribute('aria-pressed',String(show));input.focus()});wrap.appendChild(toggle)})}
enhancePasswordFields(document);
function openModal(title,body,action){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;enhancePasswordFields($('modalBody'));modalAction=action;$('modalSave').classList.remove('hidden');$('modalBg').classList.remove('hidden')}
function closeModal(){$('modalBg').classList.add('hidden');modalAction=null}
$('modalCancel').onclick=closeModal;
$('modalSave').onclick=async()=>{if(!modalAction)return;const b=$('modalSave');setBusy(b,true,'Saving…');try{await modalAction();closeModal()}catch(e){toast(e.message||'Could not save changes')}finally{setBusy(b,false)}};
function authMode(signup){isSignup=signup;$('authUsername').classList.toggle('hidden',!signup);$('authMain').textContent=signup?'Create account':'Log in';$('authSwitch').textContent=signup?'I already have an account':'Create account';$('forgotBtn').classList.toggle('hidden',signup);$('authMessage').textContent=''}
$('authSwitch').onclick=()=>authMode(!isSignup);
$('authMain').onclick=async()=>{const email=$('authEmail').value.trim(),password=$('authPassword').value,username=$('authUsername').value.trim().toLowerCase();if(!email||!password)return toast('Enter email and password');if(isSignup&&(!/^[a-z0-9_]{3,24}$/.test(username)))return toast('Username: 3–24 letters, numbers or underscores');const b=$('authMain');setBusy(b,true,'Please wait…');try{if(isSignup){const {data,error}=await db.auth.signUp({email,password});if(error)throw error;if(data.user){const {error:pe}=await db.from('profiles').upsert({id:data.user.id,username,display_name:username},{onConflict:'id'});if(pe)throw pe}toast('Account created. Log in if needed.')}else{const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error}}catch(e){toast(e.message)}finally{setBusy(b,false)}};
$('forgotBtn').onclick=async()=>{const email=$('authEmail').value.trim();if(!email)return toast('Enter your email first');const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});toast(error?error.message:'If the email is registered, a reset link has been sent.')};

async function loadProfile(){const {data,error}=await db.from('profiles').select('*').eq('id',user.id).single();if(error)throw error;profile=data;$('myName').textContent=data.display_name||data.username;$('myHandle').textContent='@'+data.username;const url=await signedAsset(data.avatar_url);if(url){$('myAvatar').onerror=()=>fallbackImage($('myAvatar'),data);$('myAvatar').src=url}else fallbackImage($('myAvatar'),data)}
async function startApp(){user=(await db.auth.getUser()).data.user;if(!user){$('authView').classList.remove('hidden');$('app').classList.add('hidden');return}try{await loadProfile();$('authView').classList.add('hidden');$('app').classList.remove('hidden');await Promise.all([loadPeople(),loadRequests()]);startPresence()}catch(e){toast('Profile setup: '+e.message)}}

async function loadPeople(){
 try{
  // 1) Accepted friendships are the source of truth for the Friends list.
  const {data:accepted,error:ae}=await db.from('friend_requests')
   .select('sender_id,receiver_id')
   .eq('status','accepted')
   .or(`sender_id.eq.${user.id},receiver_id.eq.${user.id}`);
  if(ae)throw ae;

  const friendIds=[...new Set((accepted||[]).map(r=>
   r.sender_id===user.id?r.receiver_id:r.sender_id
  ).filter(Boolean))];

  if(!friendIds.length){
   window.__onlyUsPeople=[];
   window.__onlyUsFriendChats={};
   $('peopleList').innerHTML='<div class="hint" style="padding:10px">No friends yet. Search for a username above.</div>';
   return;
  }

  // 2) Load profiles separately; avoids fragile nested profile joins.
  const {data:profiles,error:pe}=await db.from('profiles')
   .select('id,username,display_name,avatar_url,last_seen_at')
   .in('id',friendIds);
  if(pe)throw pe;

  // 3) Find all conversations that contain the signed-in user.
  const {data:myRows,error:me}=await db.from('conversation_members')
   .select('conversation_id')
   .eq('user_id',user.id);
  if(me)throw me;
  const myConversationIds=[...new Set((myRows||[]).map(x=>x.conversation_id).filter(Boolean))];

  // 4) Find which accepted friends share each conversation with this user.
  let peerRows=[];
  if(myConversationIds.length){
   const {data,error}=await db.from('conversation_members')
    .select('conversation_id,user_id')
    .in('conversation_id',myConversationIds)
    .in('user_id',friendIds);
   if(error)throw error;
   peerRows=data||[];
  }

  // 5) Prefer a conversation with the newest message; otherwise use the first shared one.
  const sharedByFriend={};
  peerRows.forEach(r=>{
   if(!sharedByFriend[r.user_id])sharedByFriend[r.user_id]=[];
   if(!sharedByFriend[r.user_id].includes(r.conversation_id))sharedByFriend[r.user_id].push(r.conversation_id);
  });

  const allSharedIds=[...new Set(Object.values(sharedByFriend).flat())];
  let latestByConversation={};
  if(allSharedIds.length){
   const {data:messages,error:msgError}=await db.from('messages')
    .select('conversation_id,created_at')
    .in('conversation_id',allSharedIds)
    .order('created_at',{ascending:false});
   // Message visibility can be restricted by RLS; membership still gives a safe fallback.
   if(!msgError)(messages||[]).forEach(m=>{
    if(!latestByConversation[m.conversation_id])latestByConversation[m.conversation_id]=m.created_at;
   });
  }

  const {data:hidden,error:he}=await db.from('hidden_conversations')
   .select('conversation_id').eq('user_id',user.id);
  if(he)throw he;
  const hiddenIds=new Set((hidden||[]).map(x=>x.conversation_id));

  const friendChats={};
  (profiles||[]).forEach(p=>{
   const chats=sharedByFriend[p.id]||[];
   if(!chats.length)return;
   chats.sort((a,b)=>{
    const aTime=latestByConversation[a]?new Date(latestByConversation[a]).getTime():0;
    const bTime=latestByConversation[b]?new Date(latestByConversation[b]).getTime():0;
    return bTime-aTime;
   });
   // If the most recent chat is hidden, use the next visible one when available.
   const chosen=chats.find(id=>!hiddenIds.has(id))||chats[0];
   friendChats[p.id]={...p,conversation_id:chosen,isHidden:hiddenIds.has(chosen)};
  });

  window.__onlyUsFriendChats=friendChats;
  window.__onlyUsPeople=Object.values(friendChats).filter(p=>!p.isHidden);
  const people=window.__onlyUsPeople;
  $('peopleList').innerHTML=people.map(p=>
   `<div class="person" data-chat="${esc(p.conversation_id)}" data-peer="${esc(p.id)}">${avatarHTML(p)}<div class="person-info"><b>${esc(p.display_name||p.username||'Friend')}</b><small>@${esc(p.username||'username')} · <span class="person-status" data-person-status="${esc(p.id)}">Last seen recently</span></small></div><button type="button" class="friend-remove-btn" data-remove-friend="${esc(p.id)}" title="Remove friend" aria-label="Remove ${esc(p.username||'friend')}">×</button></div>`
  ).join('')||'<div class="hint" style="padding:10px">No visible chats. Search for a friend to reopen a hidden chat.</div>';
  await hydrateAvatars($('peopleList'));
  refreshPresenceLabels();
 }catch(error){
  console.error('loadPeople error:',error);
  $('peopleList').innerHTML=`<div class="hint" style="padding:10px">Could not load friends: ${esc(error.message||'Unknown error')}</div>`;
  throw error;
 }
}

async function loadMessages(){
 if(!currentChat)return;
 const {data,error}=await db.from('messages').select('id,conversation_id,sender_id,content,image_url,created_at,seen_at,deleted_at').eq('conversation_id',currentChat).order('created_at',{ascending:true});
 if(error)return toast(error.message);
 const ids=(data||[]).map(m=>m.id);let hidden=new Set();
 if(ids.length){const {data:h,error:hideError}=await db.from('message_hidden').select('message_id').eq('user_id',user.id).in('message_id',ids);if(!hideError)hidden=new Set((h||[]).map(x=>x.message_id))}
 const visible=(data||[]).filter(m=>!hidden.has(m.id));const idsVisible=visible.map(m=>m.id);let reactionMap={};
 if(idsVisible.length){const {data:rx,error:rxError}=await db.from('message_reactions').select('message_id,user_id,emoji').in('message_id',idsVisible);if(!rxError)(rx||[]).forEach(r=>{(reactionMap[r.message_id]??=[]).push(r)})}
 const hydrated=await Promise.all(visible.map(async m=>{
  if(m.image_url&&!m.image_url.startsWith('http')){const {data:signed}=await db.storage.from('chat-photos').createSignedUrl(m.image_url,3600);return {...m,image_url:signed?.signedUrl||''}}
  return m
 }));
 if(!currentChat)return;
 $('messages').innerHTML=hydrated.map(m=>renderMessage(m,reactionMap[m.id]||[])).join('');
 $('messages').scrollTop=$('messages').scrollHeight;
 const unread=visible.filter(m=>m.sender_id!==user.id&&!m.seen_at&&!m.deleted_at).map(m=>m.id);
 if(unread.length)await db.from('messages').update({seen_at:new Date().toISOString()}).in('id',unread);
}
function renderMessage(m,reactions=[]){
 const mine=m.sender_id===user.id,deleted=!!m.deleted_at;
 const time=new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
 const emojiOnly=!!m.content&&/^[\p{Extended_Pictographic}\uFE0F\u200D\s]+$/u.test(m.content);
 const messageText=m.content?(emojiOnly?`<span class="emoji-message">${esc(m.content)}</span>`:esc(m.content).replace(/\n/g,'<br>')):'';
 let content=deleted?'<div class="bubble deleted">This message was deleted</div>':`<div class="bubble">${m.image_url?`<img src="${esc(m.image_url)}" alt="Shared photo" onerror="this.style.display='none'">`:''}${messageText}</div>`;
 const grouped={};reactions.forEach(r=>{grouped[r.emoji]??={count:0,mine:false};grouped[r.emoji].count++;if(r.user_id===user.id)grouped[r.emoji].mine=true});
 const reactionHTML=Object.entries(grouped).map(([emoji,v])=>`<button class="reaction-chip ${v.mine?'mine':''}" data-react-msg="${m.id}" data-emoji="${emoji}" title="React ${emoji}">${emoji} ${v.count}</button>`).join('');
 return `<div class="message ${mine?'mine':''}" data-message="${m.id}" data-deleted="${deleted}">${content}${reactionHTML?`<div class="reaction-row">${reactionHTML}</div>`:''}<div class="msg-foot"><span>${time}</span>${mine&&!deleted?`<span>${m.seen_at?relativeSeen(m.seen_at):'Sent'}</span>`:''}<button class="msg-menu" data-msgid="${m.id}" data-deleted="${deleted}" title="Message options">⋮</button></div></div>`
}
