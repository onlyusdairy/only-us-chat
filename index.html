<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#160b13">
<title>Only Us — Private Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#100910;--panel:#1b111b;--panel2:#281a2a;--line:#493047;--pink:#e879a8;--text:#fff0f7;--muted:#bda8b8;--red:#ff7185}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--text);padding:10px 13px}button:disabled{opacity:.5;cursor:wait}.hidden{display:none!important}
input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:#100910;color:white;margin:6px 0;outline:none}input:focus{border-color:var(--pink)}
.primary{background:var(--pink);color:#210d19;border:0;font-weight:bold}.danger{color:var(--red)}#auth{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#48233d,#100910 65%)}.card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);padding:25px;border-radius:20px}.logo{text-align:center;font-size:32px;color:var(--pink);font-weight:bold}.muted{color:var(--muted);font-size:13px}.center{text-align:center}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.grow{flex:1}#app{height:100dvh;max-width:1200px;margin:auto;display:grid;grid-template-columns:330px 1fr;background:var(--panel);border-inline:1px solid var(--line)}aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.top{padding:15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.top b{font-size:22px;color:var(--pink)}.profile{padding:12px;border-bottom:1px solid var(--line)}.section{padding:12px 12px 4px;color:var(--pink);font-size:12px;font-weight:bold;text-transform:uppercase}.list{overflow:auto}.person{padding:12px;border-bottom:1px solid #ffffff12;display:flex;gap:10px;align-items:center;cursor:pointer}.person:hover{background:#ffffff0c}.person-info{flex:1;min-width:0}.person-info b,.person-info small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.person-info small{color:var(--muted);margin-top:4px}.avatar{width:42px;height:42px;border-radius:50%;background:#71304f;display:grid;place-items:center;flex-shrink:0;object-fit:cover}#chat{display:flex;flex-direction:column;min-width:0;min-height:0}.chathead{padding:12px;border-bottom:1px solid var(--line)}#messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}.msg{max-width:min(78%,520px);align-self:flex-start}.msg.mine{align-self:flex-end}.bubble{padding:11px 14px;border-radius:15px;background:var(--panel2);overflow-wrap:anywhere;line-height:1.4}.mine .bubble{background:#71304f}.bubble img{max-width:100%;max-height:300px;border-radius:9px;display:block}.foot{font-size:10px;color:var(--muted);text-align:right;padding:4px}.compose{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px}.compose input{margin:0}.compose button{flex-shrink:0}#empty{display:grid;place-items:center;text-align:center;color:var(--muted);padding:25px}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#493047;padding:12px 16px;border-radius:12px;z-index:20;max-width:90vw}.modalbg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:10}.modal{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);padding:20px;border-radius:16px}.actions{display:flex;gap:8px;flex-wrap:wrap;padding:10px}.actions button{flex:1}
@media(max-width:700px){#app{display:block}aside{height:100dvh}#chat{display:none;height:100dvh}#app.chat-open aside{display:none}#app.chat-open #chat{display:flex}}
</style>
</head>
<body>
<section id="auth">
 <div class="card">
  <div class="logo">Only Us ♡</div><p class="muted center">A little space, just for us.</p>
  <input id="username" class="hidden" placeholder="Choose username (3–24 characters)">
  <input id="email" type="email" placeholder="Email address" autocomplete="email">
  <div class="row"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="showPass" type="button">Show</button></div>
  <button id="authBtn" class="primary" style="width:100%;margin-top:8px">Log in</button>
  <div class="center"><button id="switch" class="muted">Create account</button><button id="forgot" class="muted">Forgot password?</button></div>
  <p id="authNote" class="muted"></p>
 </div>
</section>
<main id="app" class="hidden">
 <aside>
  <div class="top"><b>Only Us ♡</b><button id="logout">Log out</button></div>
  <div class="profile"><div class="row"><div id="myAvatar" class="avatar">♡</div><div class="person-info"><b id="myName">My profile</b><small id="myHandle"></small></div></div>
   <div class="actions"><button id="edit">Edit profile</button><button id="photoBtn">Change photo</button></div>
  </div>
  <div style="padding:10px"><input id="search" placeholder="Search username..."></div>
  <div class="section">Friend requests</div><div id="requests" class="list"></div>
  <div class="section">Friends</div><div id="friends" class="list"></div>
 </aside>
 <section id="chat">
  <div class="chathead row"><button id="back">←</button><div id="peerAvatar" class="avatar">♡</div><div class="person-info"><b id="peerName">Choose a friend</b><small id="peerStatus" class="muted"></small></div><button id="hideChat">Hide</button></div>
  <div id="empty"><div><div style="font-size:40px">♡</div><h2>Your space, your people.</h2><p>Search a username and start chatting.</p></div></div>
  <div id="messages" class="hidden"></div>
  <form id="compose" class="compose hidden"><input id="message" placeholder="Write a message..." autocomplete="off"><button class="primary">Send</button><label><button type="button" id="attach">＋</button><input id="file" type="file" accept="image/*" class="hidden"></label></form>
 </section>
</main>
<div id="modal" class="modalbg hidden"><div class="modal"><h3 id="modalTitle">Edit profile</h3><div id="modalBody"></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button id="cancel">Cancel</button><button id="save" class="primary">Save</button></div></div></div>
<div id="toast" class="hidden"></div>
<script>
(()=>{
'use strict';
const URL='https://vdmnhlwemcwdmwjfggzn.supabase.co';
const KEY='sb_publishable_S19oIIHBfauqBpQXwgJsXw_yeZHBsBQ';
const $=id=>document.getElementById(id);
const say=s=>{ $('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(say.t);say.t=setTimeout(()=>$('toast').classList.add('hidden'),3200)};
if(!window.supabase?.createClient){$('authNote').textContent='Supabase library did not load. Check internet and refresh.';return}
const db=window.supabase.createClient(URL,KEY);
let user=null,profile=null,signup=false,chatId=null,friend=null,modalSave=null,channel=null,searchTimer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=p=>(p?.display_name||p?.username||'?').slice(0,1).toUpperCase();
async function asset(path){if(!path)return '';if(/^https?:/i.test(path))return path;const {data,error}=await db.storage.from('chat-photos').createSignedUrl(path,3600);return error?'':data?.signedUrl||''}
function setAuthMode(v){signup=v;$('username').classList.toggle('hidden',!v);$('authBtn').textContent=v?'Create account':'Log in';$('switch').textContent=v?'I already have an account':'Create account';$('forgot').classList.toggle('hidden',v);$('authNote').textContent=''}
$('switch').onclick=()=>setAuthMode(!signup);
$('showPass').onclick=()=>{$('password').type=$('password').type==='password'?'text':'password';$('showPass').textContent=$('password').type==='password'?'Show':'Hide'};
$('authBtn').onclick=async()=>{
 const email=$('email').value.trim(),password=$('password').value,username=$('username').value.trim().toLowerCase();
 if(!email||!password)return say('Enter email and password');
 if(signup&&!/^[a-z0-9_]{3,24}$/.test(username))return say('Username: 3–24 letters, numbers or underscores');
 const b=$('authBtn');b.disabled=true;b.textContent='Please wait…';
 try{
  if(signup){const {data,error}=await db.auth.signUp({email,password});if(error)throw error;if(data.user){const {error:e}=await db.from('profiles').upsert({id:data.user.id,username,display_name:username},{onConflict:'id'});if(e)throw e}if(data.session)await start();else{say('Account created. Verify email if required, then log in.');setAuthMode(false)}}
  else{const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error;await start()}
 }catch(e){say(e.message||'Authentication failed')}finally{b.disabled=false;b.textContent=signup?'Create account':'Log in'}
};
$('forgot').onclick=async()=>{const email=$('email').value.trim();if(!email)return say('Enter your email first');const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});say(error?.message||'If registered, a reset link was sent')};
async function start(){
 const {data,error}=await db.auth.getUser();if(error)throw error;user=data.user;if(!user)return;
 const {data:p,error:pe}=await db.from('profiles').select('*').eq('id',user.id).single();if(pe)throw pe;profile=p;
 $('myName').textContent=p.display_name||p.username;$('myHandle').textContent='@'+p.username;
 const av=await asset(p.avatar_url);$('myAvatar').innerHTML=av?`<img class="avatar" src="${esc(av)}">`:esc(initials(p));
 $('auth').classList.add('hidden');$('app').classList.remove('hidden');
 await Promise.all([loadFriends(),loadRequests()]);
}
async function loadFriends(){
 const {data:rows,error}=await db.from('friend_requests').select('sender_id,receiver_id').eq('status','accepted').or(`sender_id.eq.${user.id},receiver_id.eq.${user.id}`);if(error)throw error;
 const ids=[...new Set((rows||[]).map(r=>r.sender_id===user.id?r.receiver_id:r.sender_id))];
 if(!ids.length){$('friends').innerHTML='<p class="muted" style="padding:10px">No friends yet.</p>';return}
 const {data:ps,error:e}=await db.from('profiles').select('id,username,display_name,avatar_url').in('id',ids);if(e)throw e;
 const {data:mine,error:me}=await db.from('conversation_members').select('conversation_id').eq('user_id',user.id);if(me)throw me;
 const chats=[...new Set((mine||[]).map(x=>x.conversation_id))];
 let shared=[];if(chats.length){const {data,error:x}=await db.from('conversation_members').select('conversation_id,user_id').in('conversation_id',chats).in('user_id',ids);if(x)throw x;shared=data||[]}
 const hiddenRows=await db.from('hidden_conversations').select('conversation_id').eq('user_id',user.id);if(hiddenRows.error)throw hiddenRows.error;
 const hidden=new Set((hiddenRows.data||[]).map(x=>x.conversation_id));
 const map={};shared.forEach(x=>{(map[x.user_id]??=[]).push(x.conversation_id)});
 window.friendMap={};
 $('friends').innerHTML=(ps||[]).map(p=>{const cid=(map[p.id]||[]).find(x=>!hidden.has(x))||(map[p.id]||[])[0];if(!cid)return '';window.friendMap[p.id]={...p,conversation_id:cid};return `<div class="person" data-peer="${p.id}" data-chat="${cid}"><div class="avatar">${esc(initials(p))}</div><div class="person-info"><b>${esc(p.display_name||p.username)}</b><small>@${esc(p.username)}</small></div><button data-remove="${p.id}" class="danger">×</button></div>`}).join('')||'<p class="muted" style="padding:10px">No chats yet.</p>';
}
async function loadRequests(){
 const {data,error}=await db.from('friend_requests').select('id,sender_id,receiver_id,status').eq('receiver_id',user.id).eq('status','pending');if(error)throw error;
 if(!data?.length){$('requests').innerHTML='<p class="muted" style="padding:10px">No pending requests.</p>';return}
 const ids=data.map(x=>x.sender_id);const {data:ps,error:e}=await db.from('profiles').select('id,username,display_name').in('id',ids);if(e)throw e;
 $('requests').innerHTML=data.map(r=>{const p=ps.find(x=>x.id===r.sender_id);return `<div class="person"><div class="person-info"><b>${esc(p?.display_name||p?.username||'User')}</b><small>@${esc(p?.username||'')}</small></div><button data-accept="${r.id}">✓</button><button data-reject="${r.id}">×</button></div>`}).join('');
}
$('search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(searchUsers,300)};
async function searchUsers(){
 const q=$('search').value.trim().toLowerCase();if(q.length<2)return;
 const {data,error}=await db.from('profiles').select('id,username,display_name').ilike('username',`%${q}%`).neq('id',user.id).limit(12);if(error)return say(error.message);
 $('friends').innerHTML=(data||[]).map(p=>`<div class="person"><div class="person-info"><b>${esc(p.display_name||p.username)}</b><small>@${esc(p.username)}</small></div><button data-add="${p.id}">Add</button></div>`).join('')||'<p class="muted" style="padding:10px">No users found.</p>';
}
$('friends').onclick=async e=>{
 const add=e.target.closest('[data-add]'),remove=e.target.closest('[data-remove]'),row=e.target.closest('[data-chat]');
 try{
  if(add){const {error}=await db.from('friend_requests').insert({sender_id:user.id,receiver_id:add.dataset.add,status:'pending'});if(error)throw error;say('Friend request sent');$('search').value='';await loadFriends();return}
  if(remove){if(!confirm('Remove friend? Existing messages will remain.'))return;const {error}=await db.rpc('remove_friend',{p_friend_id:remove.dataset.remove});if(error)throw error;await loadFriends();say('Friend removed');return}
  if(row)await openChat(row.dataset.chat,row.dataset.peer);
 }catch(x){say(x.message)}
};
$('requests').onclick=async e=>{
 const a=e.target.closest('[data-accept]'),r=e.target.closest('[data-reject]');try{
 if(a){const {error}=await db.rpc('accept_friend_request',{p_request_id:a.dataset.accept});if(error)throw error}
 if(r){const {error}=await db.rpc('reject_friend_request',{p_request_id:r.dataset.reject});if(error)throw error}
 await loadRequests();await loadFriends()
 }catch(x){say(x.message)}
};
async function openChat(id,peerId){
 const {error:u}=await db.rpc('unhide_conversation_for_me',{p_conversation_id:id});if(u)throw u;
 const {data:p,error}=await db.from('profiles').select('*').eq('id',peerId).single();if(error)throw error;
 chatId=id;friend=p;$('peerName').textContent=p.display_name||p.username;const av=await asset(p.avatar_url);$('peerAvatar').innerHTML=av?`<img class="avatar" src="${esc(av)}">`:esc(initials(p));
 $('empty').classList.add('hidden');$('messages').classList.remove('hidden');$('compose').classList.remove('hidden');$('app').classList.add('chat-open');
 await loadMessages();if(channel)db.removeChannel(channel);
 channel=db.channel('chat-'+id).on('postgres_changes',{event:'*',schema:'public',table:'messages',filter:'conversation_id=eq.'+id},loadMessages).on('postgres_changes',{event:'*',schema:'public',table:'message_reactions'},loadMessages).subscribe();
}
async function loadMessages(){
 if(!chatId)return;const id=chatId;
 const {data,error}=await db.from('messages').select('id,sender_id,content,image_url,created_at,seen_at,deleted_at').eq('conversation_id',id).order('created_at',{ascending:true});if(error)return say(error.message);
 const ids=(data||[]).map(m=>m.id);let hidden=new Set();
 if(ids.length){const {data:h,error:he}=await db.from('message_hidden').select('message_id').eq('user_id',user.id).in('message_id',ids);if(he)return say(he.message);hidden=new Set((h||[]).map(x=>x.message_id))}
 const visible=(data||[]).filter(m=>!hidden.has(m.id));const rx={};
 if(visible.length){const {data:r}=await db.from('message_reactions').select('message_id,user_id,emoji').in('message_id',visible.map(m=>m.id));(r||[]).forEach(x=>(rx[x.message_id]??=[]).push(x))}
 const html=await Promise.all(visible.map(async m=>{
  const image=m.image_url?await asset(m.image_url):'';
  const reactions=(rx[m.id]||[]).map(r=>`<button data-react="${m.id}" data-emoji="${esc(r.emoji)}">${esc(r.emoji)}</button>`).join('');
  const body=m.deleted_at?'<i>This message was deleted</i>':`${image?`<img src="${esc(image)}" alt="Shared photo">`:''}${esc(m.content||'').replace(/\n/g,'<br>')}`;
  return `<div class="msg ${m.sender_id===user.id?'mine':''}"><div class="bubble">${body}</div><div class="foot">${new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} <button data-menu="${m.id}">⋮</button></div><div>${reactions}</div></div>`;
 }));
 if(chatId!==id)return;$('messages').innerHTML=html.join('');$('messages').scrollTop=$('messages').scrollHeight;
}
$('messages').onclick=async e=>{
 const react=e.target.closest('[data-react]'),menu=e.target.closest('[data-menu]');try{
 if(react){const {data,error}=await db.from('message_reactions').select('id').eq('message_id',react.dataset.react).eq('user_id',user.id).eq('emoji',react.dataset.emoji);if(error)throw error;if(data?.length){const {error:x}=await db.from('message_reactions').delete().in('id',data.map(x=>x.id));if(x)throw x}else{const {error:x}=await db.from('message_reactions').insert({message_id:react.dataset.react,user_id:user.id,emoji:react.dataset.emoji});if(x)throw x}await loadMessages()}
 if(menu){const id=menu.dataset.menu;const choice=prompt('Type: ❤️ 😂 😮 😢 👍 🔥\\nOr type DELETE ME / DELETE ALL');if(!choice)return;if(['❤️','😂','😮','😢','👍','🔥'].includes(choice)){const {error}=await db.from('message_reactions').insert({message_id:id,user_id:user.id,emoji:choice});if(error)throw error;await loadMessages()}else if(choice.toUpperCase()==='DELETE ME'){const {error}=await db.rpc('hide_message_for_me',{p_message_id:id});if(error)throw error;await loadMessages()}else if(choice.toUpperCase()==='DELETE ALL'){if(!confirm('Delete this message for both people?'))return;const {error}=await db.rpc('delete_message_for_everyone',{p_message_id:id});if(error)throw error;await loadMessages()}}
 }catch(x){say(x.message)}
};
$('compose').onsubmit=async e=>{e.preventDefault();const content=$('message').value.trim();if(!content||!chatId)return;const {error}=await db.from('messages').insert({conversation_id:chatId,sender_id:user.id,content});if(error)return say(error.message);$('message').value='';await loadMessages()};
$('attach').onclick=()=>$('file').click();
$('file').onchange=async()=>{const f=$('file').files[0];if(!f||!chatId)return;if(f.size>5*1024*1024)return say('Image must be under 5 MB');const path=`${chatId}/${user.id}/${crypto.randomUUID()}.${(f.name.split('.').pop()||'jpg').toLowerCase()}`;try{const {error}=await db.storage.from('chat-photos').upload(path,f,{contentType:f.type});if(error)throw error;const {error:e}=await db.from('messages').insert({conversation_id:chatId,sender_id:user.id,image_url:path,content:''});if(e)throw e;await loadMessages();say('Photo sent')}catch(x){say(x.message)}finally{$('file').value=''}};
$('hideChat').onclick=async()=>{if(!chatId)return;try{const {error}=await db.rpc('hide_conversation_for_me',{p_conversation_id:chatId});if(error)throw error;if(channel)db.removeChannel(channel);channel=null;chatId=null;$('app').classList.remove('chat-open');$('empty').classList.remove('hidden');$('messages').classList.add('hidden');$('compose').classList.add('hidden');await loadFriends()}catch(x){say(x.message)}};
$('back').onclick=()=>$('app').classList.remove('chat-open');
function modal(title,body,fn){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;modalSave=fn;$('modal').classList.remove('hidden')}
$('cancel').onclick=()=>$('modal').classList.add('hidden');
$('save').onclick=async()=>{if(!modalSave)return;try{await modalSave();$('modal').classList.add('hidden')}catch(x){say(x.message)}};
$('edit').onclick=()=>modal('Edit profile',`<input id="display" placeholder="Display name" value="${esc(profile.display_name||'')}"><input id="handle" placeholder="Username" value="${esc(profile.username||'')}">`,async()=>{const display_name=$('display').value.trim(),username=$('handle').value.trim().toLowerCase();if(!/^[a-z0-9_]{3,24}$/.test(username))throw Error('Username must be 3–24 letters, numbers or underscores');const {error}=await db.from('profiles').update({display_name,username}).eq('id',user.id);if(error)throw error;const {data}=await db.from('profiles').select('*').eq('id',user.id).single();profile=data;$('myName').textContent=data.display_name||data.username;$('myHandle').textContent='@'+data.username;await loadFriends()});
$('photoBtn').onclick=()=>{const f=document.createElement('input');f.type='file';f.accept='image/png,image/jpeg,image/webp';f.onchange=async()=>{const file=f.files[0];if(!file)return;if(file.size>5*1024*1024)return say('Image must be under 5 MB');const path=`avatars/${user.id}/${crypto.randomUUID()}.${file.name.split('.').pop()}`;try{const {error}=await db.storage.from('chat-photos').upload(path,file,{upsert:true,contentType:file.type});if(error)throw error;const {error:e}=await db.from('profiles').update({avatar_url:path}).eq('id',user.id);if(e)throw e;profile.avatar_url=path;const url=await asset(path);$('myAvatar').innerHTML=url?`<img class="avatar" src="${esc(url)}">`:esc(initials(profile));say('Profile photo updated')}catch(x){say(x.message)}};f.click()};
$('logout').onclick=async()=>{if(channel)await db.removeChannel(channel);await db.auth.signOut();user=null;profile=null;chatId=null;$('app').classList.add('hidden');$('auth').classList.remove('hidden')};
db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session?.user)setTimeout(()=>start().catch(e=>say(e.message)),0);if(event==='SIGNED_OUT'){user=null;profile=null;$('app').classList.add('hidden');$('auth').classList.remove('hidden')}});
start().catch(e=>say('Setup error: '+e.message));
})();
</script>
</body>
</html>
