<style>
:root{--bg:#100910;--panel:#1b101a;--panel2:#241521;--line:#382333;--pink:#ff6fae;--pink2:#e94791;--text:#fff1f7;--muted:#b99eae;--bubble:#30202e;--mine:#71304f;--danger:#ff7185;--shadow:0 18px 60px #0008}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:radial-gradient(ellipse at 15% 0%,#3a1830 0,transparent 38%),radial-gradient(ellipse at 100% 100%,#291324 0,transparent 35%),var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;color:inherit}.hidden{display:none!important}.auth-wrap{min-height:100dvh;display:grid;place-items:center;padding:22px}.auth-card{width:min(430px,100%);padding:34px;border:1px solid #ffffff18;background:#1b101ae8;backdrop-filter:blur(18px);border-radius:28px;box-shadow:var(--shadow);animation:rise .5s ease}.brand{font:700 34px 'Playfair Display',serif;text-align:center;color:#ffd2e5}.brand span{color:var(--pink)}.tagline{text-align:center;color:var(--muted);margin:8px 0 26px;font-size:13px}.field{display:block;width:100%;margin:10px 0;padding:14px 15px;border-radius:14px;border:1px solid var(--line);background:#100a11;color:var(--text);outline:none}.field:focus{border-color:var(--pink);box-shadow:0 0 0 3px #ff6fae20}.password-wrap{position:relative;width:100%;margin:10px 0}.password-wrap .field{margin:0;padding-right:72px}.password-toggle{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:1px solid #ffffff18;border-radius:9px;background:#ffffff0b;color:#ffc4dc;padding:7px 9px;font-size:12px;font-weight:700;min-width:48px}.password-toggle:hover{background:#ff6fae24;color:#fff}.password-toggle:focus-visible{outline:2px solid var(--pink);outline-offset:2px}.primary{background:linear-gradient(135deg,var(--pink),var(--pink2));color:#260d1b;font-weight:700;padding:13px 18px;border-radius:14px;box-shadow:0 8px 25px #e9479140}.primary:disabled{opacity:.5;cursor:wait}.wide{width:100%;margin-top:8px}.quiet{background:transparent;color:var(--muted);padding:10px}.quiet:hover{color:var(--pink)}.auth-links{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px}.hint{color:var(--muted);font-size:12px;line-height:1.5}.app{height:100dvh;max-width:1500px;margin:auto;padding:18px;display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px}.sidebar,.chat-panel{min-height:0;border:1px solid #ffffff16;background:#1b101ae8;backdrop-filter:blur(18px);border-radius:25px;box-shadow:var(--shadow);overflow:hidden}.sidebar{display:flex;flex-direction:column}.side-head{padding:21px;border-bottom:1px solid var(--line)}.side-brand{font:700 25px 'Playfair Display',serif}.side-brand span{color:var(--pink)}.profile-row{display:flex;align-items:center;gap:11px;margin-top:17px}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#71304f,#e94791);display:grid;place-items:center;font-weight:700;color:white;flex:none}.profile-meta{min-width:0;flex:1}.profile-meta strong,.profile-meta small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.profile-meta small{color:var(--muted);font-size:12px;margin-top:3px}.icon-btn{width:36px;height:36px;border-radius:12px;background:#ffffff0c;color:#f4c5dc}.icon-btn:hover{background:#ff6fae24;color:#fff}.search{margin:14px 16px 8px}.section-label{padding:10px 18px 5px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.5px}.people-list{overflow:auto;padding:4px 10px}.person{display:flex;align-items:center;gap:11px;padding:11px;border-radius:15px;cursor:pointer;transition:.2s}.person:hover,.person.active{background:#ff6fae16}.person .avatar{width:40px;height:40px}.person-info{min-width:0;flex:1}.person-info b,.person-info small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.person-info small{font-size:12px;color:var(--muted);margin-top:4px}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:12px;display:flex;gap:8px}.side-bottom button{flex:1;background:#ffffff0b;border-radius:12px;padding:11px 6px;font-size:12px}.side-bottom button:hover{background:#ff6fae20}.chat-panel{display:flex;flex-direction:column;position:relative}.empty-state{margin:auto;text-align:center;color:var(--muted);padding:25px}.empty-heart{font-size:52px;filter:drop-shadow(0 0 18px #ff6fae88);animation:beat 2s infinite}.chat-head{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;min-height:75px}.chat-head .profile-meta small{color:#ff9bc5}.chat-actions{margin-left:auto;display:flex;gap:7px}.mobile-back{display:none}.messages{flex:1;min-height:0;overflow:auto;padding:22px clamp(12px,4vw,42px);display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}.date-label{text-align:center;color:#967d8d;font-size:11px;margin:8px}.message{max-width:min(72%,560px);align-self:flex-start;animation:messageIn .25s ease both;position:relative}.message.mine{align-self:flex-end}.bubble{padding:12px 14px;border-radius:18px 18px 18px 5px;background:var(--bubble);border:1px solid #ffffff0c;box-shadow:0 6px 20px #0002;overflow-wrap:anywhere;line-height:1.45}.mine .bubble{background:linear-gradient(135deg,#71304f,#54253e);border-radius:18px 18px 5px 18px}.bubble.deleted{color:#d7b8c9;font-style:italic;background:#ffffff0a}.bubble img{display:block;max-width:min(100%,330px);max-height:330px;object-fit:contain;border-radius:12px;margin-bottom:5px}.msg-foot{display:flex;align-items:center;gap:8px;justify-content:flex-end;color:#bda2b2;font-size:10px;margin:4px 3px 0}.msg-menu{background:transparent;color:#d6b5c7;font-size:15px;padding:0 3px}.msg-menu:hover{color:white}.chat-compose{padding:14px 18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px;background:#180e18}.compose-input{flex:1;min-width:0;background:#100a11;border:1px solid var(--line);border-radius:18px;padding:13px 15px;color:white;outline:none}.compose-input:focus{border-color:#b64b7e}.send-btn{width:45px;height:45px;border-radius:15px;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#260d1b;font-size:18px;font-weight:bold}.typing{font-size:11px;color:var(--pink);padding:0 25px 8px;min-height:18px}.modal-bg{position:fixed;inset:0;background:#080408bb;display:grid;place-items:center;padding:18px;z-index:10;backdrop-filter:blur(8px)}.modal{width:min(440px,100%);max-height:90dvh;overflow:auto;background:#211421;border:1px solid #ffffff20;border-radius:23px;padding:23px;box-shadow:var(--shadow);animation:rise .2s ease}.modal h2{font:700 23px 'Playfair Display',serif;margin:0 0 15px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.danger{background:#5a1d32;color:#ffdce7;padding:11px 14px;border-radius:12px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:20;background:#311b2d;border:1px solid #ff6fae55;border-radius:14px;padding:12px 17px;box-shadow:var(--shadow);font-size:13px;max-width:90vw}.float-hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.22}.heart{position:absolute;bottom:-30px;color:#ff6fae;animation:floatUp linear infinite}.file-label{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#ffffff0b;cursor:pointer;font-size:18px}.file-label:hover{background:#ff6fae20}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}@keyframes messageIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes floatUp{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@media(max-width:760px){.app{display:block;padding:7px;height:100dvh}.sidebar,.chat-panel{height:calc(100dvh - 14px);border-radius:20px}.chat-panel{display:none}.app.chat-open .sidebar{display:none}.app.chat-open .chat-panel{display:flex}.mobile-back{display:inline-flex}.side-head{padding:17px}.messages{padding:15px 11px}.message{max-width:88%}.chat-head{padding:12px}.chat-compose{padding:10px;gap:7px;padding-bottom:max(10px,env(safe-area-inset-bottom))}.compose-input{padding:12px}.send-btn{width:43px;height:43px}.auth-card{padding:26px 21px}.msg-foot{font-size:9px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style></head>
<body>
<div id="authView" class="auth-wrap"><div class="auth-card"><div class="brand">Only <span>Us</span> ♡</div><div class="tagline">A little space, just for your conversations.</div><div id="authMessage" class="hint"></div><input id="authEmail" class="field" type="email" autocomplete="email" placeholder="Email address"><input id="authPassword" class="field" type="password" autocomplete="current-password" placeholder="Password"><input id="authUsername" class="field hidden" maxlength="24" placeholder="Choose a username"><button id="authMain" class="primary wide">Log in</button><div class="auth-links"><button id="authSwitch" class="quiet">Create account</button><button id="forgotBtn" class="quiet">Forgot password?</button></div><div class="hint" style="text-align:center;margin-top:15px">Use a strong, unique password. Keep it private.</div></div></div>
<div id="app" class="app hidden"><aside class="sidebar"><div class="side-head"><div class="side-brand">Only <span>Us</span> ♡</div><div class="profile-row"><img id="myAvatar" class="avatar" alt="" src=""><div class="profile-meta"><strong id="myName">Your profile</strong><small id="myHandle">@username</small></div><button class="icon-btn" id="editProfile" title="Edit profile">✎</button></div></div><input id="userSearch" class="field search" placeholder="Find people by username…"><div class="section-label">People & chats</div><div id="peopleList" class="people-list"></div><div class="section-label">Friend requests</div><div id="requestsList" class="people-list" style="max-height:140px"></div><div class="side-bottom"><button id="profilePhotoBtn">＋ Photo</button><button id="logoutBtn">Log out</button></div></aside>
<main class="chat-panel"><div class="float-hearts" id="floatHearts"></div><div id="emptyState" class="empty-state"><div class="empty-heart">♡</div><h2 style="font:700 25px 'Playfair Display',serif;color:#f7c8dc">Your little corner</h2><p>Choose a chat or find someone to say hello.</p></div><div id="chatArea" class="hidden" style="display:flex;flex-direction:column;min-height:0;flex:1"><header class="chat-head"><button id="backBtn" class="icon-btn mobile-back">‹</button><img id="peerAvatar" class="avatar" alt=""><div class="profile-meta"><strong id="peerName">Chat</strong><small id="peerStatus">Private conversation</small></div><div class="chat-actions"><button id="deleteChatBtn" class="icon-btn" title="Delete entire chat">⌫</button></div></header><div id="messages" class="messages"></div><div id="typingStatus" class="typing"></div><form id="composeForm" class="chat-compose"><label class="file-label" title="Send photo">＋<input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden></label><input id="messageInput" class="compose-input" maxlength="4000" autocomplete="off" placeholder="Write a message…"><button class="send-btn" type="submit" aria-label="Send">➤</button></form></div></main></div>
<div id="modalBg" class="modal-bg hidden"><div class="modal"><h2 id="modalTitle">Edit profile</h2><div id="modalBody"></div><div class="modal-actions"><button id="modalCancel" class="quiet">Cancel</button><button id="modalSave" class="primary">Save</button></div></div></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{
'use strict';
const SUPABASE_URL='https://vdmnhlwemcwdmwjfggzn.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_S19oIIHBfauqBpQXwgJsXw_yeZHBsBQ';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);let user=null,profile=null,currentChat=null,peer=null,channel=null,typingChannel=null,isSignup=false,modalAction=null,searchTimer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.add('hidden'),3000)}
function setBusy(el,busy,label){el.disabled=busy;if(busy)el.dataset.old=el.textContent;el.textContent=busy?label:(el.dataset.old||el.textContent)}
function initials(p){return esc((p?.display_name||p?.username||'?').slice(0,1).toUpperCase())}
function avatarHTML(p){return p?.avatar_url?`<img class="avatar" src="${esc(p.avatar_url)}" alt="">`:`<div class="avatar">${initials(p)}</div>`}
function enhancePasswordFields(root=document){root.querySelectorAll('input[type="password"]').forEach(input=>{if(input.closest('.password-wrap'))return;const wrap=document.createElement('div');wrap.className='password-wrap';input.parentNode.insertBefore(wrap,input);wrap.appendChild(input);const toggle=document.createElement('button');toggle.type='button';toggle.className='password-toggle';toggle.textContent='Show';toggle.setAttribute('aria-label','Show password');toggle.setAttribute('aria-pressed','false');toggle.addEventListener('click',()=>{const show=input.type==='password';input.type=show?'text':'password';toggle.textContent=show?'Hide':'Show';toggle.setAttribute('aria-label',show?'Hide password':'Show password');toggle.setAttribute('aria-pressed',String(show));input.focus()});wrap.appendChild(toggle)})}
enhancePasswordFields(document);
function openModal(title,body,action){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;enhancePasswordFields($('modalBody'));modalAction=action;$('modalSave').classList.remove('hidden');$('modalBg').classList.remove('hidden')}
function closeModal(){$('modalBg').classList.add('hidden');modalAction=null}
$('modalCancel').onclick=closeModal;$('modalSave').onclick=async()=>{if(!modalAction)return;const b=$('modalSave');setBusy(b,true,'Saving…');try{await modalAction();closeModal()}catch(e){toast(e.message||'Could not save changes')}finally{setBusy(b,false)}};
function authMode(signup){isSignup=signup;$('authUsername').classList.toggle('hidden',!signup);$('authMain').textContent=signup?'Create account':'Log in';$('authSwitch').textContent=signup?'I already have an account':'Create account';$('forgotBtn').classList.toggle('hidden',signup);$('authMessage').textContent=''}
$('authSwitch').onclick=()=>authMode(!isSignup);
$('authMain').onclick=async()=>{const email=$('authEmail').value.trim(),password=$('authPassword').value,username=$('authUsername').value.trim().toLowerCase();if(!email||!password)return toast('Enter email and password');if(isSignup&&(!/^[a-z0-9_]{3,24}$/.test(username)))return toast('Username: 3–24 letters, numbers or underscores');const b=$('authMain');setBusy(b,true,'Please wait…');try{if(isSignup){const {data,error}=await db.auth.signUp({email,password});if(error)throw error;if(data.user){const {error:pe}=await db.from('profiles').upsert({id:data.user.id,username,display_name:username},{onConflict:'id'});if(pe)throw pe}toast('Account created. Log in if needed.')}else{const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error}}catch(e){toast(e.message)}finally{setBusy(b,false)}};
$('forgotBtn').onclick=async()=>{const email=$('authEmail').value.trim();if(!email)return toast('Enter your email first');const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});toast(error?error.message:'If the email is registered, a reset link has been sent.')};
async function loadProfile(){const {data,error}=await db.from('profiles').select('*').eq('id',user.id).single();if(error)throw error;profile=data;$('myName').textContent=data.display_name||data.username;$('myHandle').textContent='@'+data.username;if(data.avatar_url){if(data.avatar_url.startsWith('http'))$('myAvatar').src=data.avatar_url;else{const {data:av}=await db.storage.from('chat-photos').createSignedUrl(data.avatar_url,3600);$('myAvatar').src=av?.signedUrl||''}}else $('myAvatar').src='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" rx="40" fill="#71304f"/><text x="50%" y="56%" font-size="32" text-anchor="middle" fill="white">${(data.display_name||data.username||'?').slice(0,1).toUpperCase()}</text></svg>`)}
async function startApp(){user=(await db.auth.getUser()).data.user;if(!user){$('authView').classList.remove('hidden');$('app').classList.add('hidden');return}try{await loadProfile();$('authView').classList.add('hidden');$('app').classList.remove('hidden');await Promise.all([loadPeople(),loadRequests()]);startPresence()}catch(e){toast('Profile setup: '+e.message)}}
async function loadPeople(){const {data:members,error}=await db.from('conversation_members').select('conversation_id').eq('user_id',user.id);if(error)throw error;const ids=(members||[]).map(x=>x.conversation_id);if(!ids.length){$('peopleList').innerHTML='<div class="hint" style="padding:10px">No chats yet. Search for a username above.</div>';return}const {data:rows}=await db.from('conversation_members').select('conversation_id,user_id,profiles(id,username,display_name,avatar_url)').in('conversation_id',ids).neq('user_id',user.id);const unique=new Map();(rows||[]).forEach(r=>{if(r.profiles)unique.set(r.conversation_id,{...r.profiles,conversation_id:r.conversation_id})});$('peopleList').innerHTML=[...unique.values()].map(p=>`<div class="person" data-chat="${p.conversation_id}" data-peer="${p.id}">${avatarHTML(p)}<div class="person-info"><b>${esc(p.display_name||p.username)}</b><small>@${esc(p.username)}</small></div></div>`).join('')||'<div class="hint" style="padding:10px">No chats yet.</div>';document.querySelectorAll('[data-chat]').forEach(el=>el.onclick=()=>openChat(el.dataset.chat,el.dataset.peer))}
async function loadRequests(){const {data,error}=await db.from('friend_requests').select('id,sender_id,profiles!friend_requests_sender_id_fkey(id,username,display_name,avatar_url)').eq('receiver_id',user.id).eq('status','pending');if(error){$('requestsList').innerHTML='';return}$('requestsList').innerHTML=(data||[]).map(r=>`<div class="person">${avatarHTML(r.profiles)}<div class="person-info"><b>${esc(r.profiles?.display_name||r.profiles?.username)}</b><small>@${esc(r.profiles?.username)}</small></div><button class="icon-btn accept" data-id="${r.id}" title="Accept">✓</button></div>`).join('')||'<div class="hint" style="padding:8px 10px">No new requests</div>';document.querySelectorAll('.accept').forEach(b=>b.onclick=async()=>{const {error}=await db.rpc('accept_friend_request',{p_request_id:b.dataset.id});if(error)toast(error.message);else{toast('Friend request accepted');loadRequests();loadPeople()}})}
$('userSearch').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(searchUsers,250)};
async function searchUsers(){const q=$('userSearch').value.trim().toLowerCase();if(q.length<2)return;const {data,error}=await db.from('profiles').select('id,username,display_name,avatar_url').ilike('username',q+'%').neq('id',user.id).limit(10);if(error)return toast(error.message);$('peopleList').innerHTML=(data||[]).map(p=>`<div class="person" data-user="${p.id}">${avatarHTML(p)}<div class="person-info"><b>${esc(p.display_name||p.username)}</b><small>@${esc(p.username)}</small></div><button class="icon-btn add-friend" data-id="${p.id}" title="Add">＋</button></div>`).join('')||'<div class="hint" style="padding:10px">No users found.</div>';document.querySelectorAll('.add-friend').forEach(b=>b.onclick=async e=>{e.stopPropagation();const {error}=await db.from('friend_requests').insert({sender_id:user.id,receiver_id:b.dataset.id,status:'pending'});toast(error?error.message:'Friend request sent')})}
async function openChat(chatId,peerId){const {data:p,error}=await db.from('profiles').select('*').eq('id',peerId).single();if(error)return toast(error.message);currentChat=chatId;peer=p;$('emptyState').classList.add('hidden');$('chatArea').classList.remove('hidden');$('app').classList.add('chat-open');$('peerName').textContent=p.display_name||p.username;$('peerStatus').textContent='Private conversation';$('peerAvatar').src=p.avatar_url||'';await loadMessages();subscribeChat()}
async function loadMessages(){const {data,error}=await db.from('messages').select('id,conversation_id,sender_id,content,image_url,created_at,seen_at,deleted_at').eq('conversation_id',currentChat).order('created_at',{ascending:true});if(error)return toast(error.message);const ids=(data||[]).map(m=>m.id);let hidden=new Set();if(ids.length){const {data:h}=await db.from('message_hidden').select('message_id').eq('user_id',user.id).in('message_id',ids);hidden=new Set((h||[]).map(x=>x.message_id))}const visible=(data||[]).filter(m=>!hidden.has(m.id));const hydrated=await Promise.all(visible.map(async m=>{if(m.image_url&&!m.image_url.startsWith('http')){const {data:signed}=await db.storage.from('chat-photos').createSignedUrl(m.image_url,3600);return {...m,image_url:signed?.signedUrl||''}}return m}));$('messages').innerHTML=hydrated.map(renderMessage).join('');$('messages').scrollTop=$('messages').scrollHeight;const unread=visible.filter(m=>m.sender_id!==user.id&&!m.seen_at&&!m.deleted_at).map(m=>m.id);if(unread.length)await db.from('messages').update({seen_at:new Date().toISOString()}).in('id',unread)}
function renderMessage(m){const mine=m.sender_id===user.id,deleted=!!m.deleted_at;const time=new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});let content=deleted?'<div class="bubble deleted">This message was deleted</div>':`<div class="bubble">${m.image_url?`<img src="${esc(m.image_url)}" alt="Shared photo">`:''}${m.content?esc(m.content).replace(/\n/g,'<br>'):''}</div>`;return `<div class="message ${mine?'mine':''}" data-message="${m.id}">${content}<div class="msg-foot"><span>${time}</span>${mine&&!deleted?`<span>${m.seen_at?'Seen':'Sent'}</span>`:''}<button class="msg-menu" data-msgid="${m.id}" data-deleted="${deleted}" title="Message options">⋮</button></div></div>`}
$('messages').addEventListener('click',e=>{const b=e.target.closest('.msg-menu');if(!b)return;const id=b.dataset.msgid,deleted=b.dataset.deleted==='true';if(deleted)return;openModal('Delete message',`<p class="hint">Choose where this message should be deleted. This action cannot be undone.</p><button id="deleteMe" class="field" style="text-align:left">Delete for me</button><button id="deleteAll" class="field" style="text-align:left">Delete for everyone</button>`,async()=>{});$('modalSave').classList.add('hidden');$('deleteMe').onclick=async()=>{const {error}=await db.rpc('hide_message_for_me',{p_message_id:id});if(error)toast(error.message);else{closeModal();loadMessages()}};$('deleteAll').onclick=async()=>{if(!confirm('Delete this message for both people?'))return;const {error}=await db.rpc('delete_message_for_everyone',{p_message_id:id});if(error)toast(error.message);else{closeModal();loadMessages()}}});
function subscribeChat(){if(channel)db.removeChannel(channel);channel=db.channel('chat-'+currentChat).on('postgres_changes',{event:'*',schema:'public',table:'messages',filter:'conversation_id=eq.'+currentChat},()=>loadMessages()).subscribe();if(typingChannel)db.removeChannel(typingChannel);typingChannel=db.channel('typing-'+currentChat).on('broadcast',{event:'typing'},({payload})=>{$('typingStatus').textContent=payload?.user_id!==user.id&&payload?.typing?'Typing…':''}).subscribe()}
$('messageInput').oninput=()=>{if(typingChannel)typingChannel.send({type:'broadcast',event:'typing',payload:{user_id:user.id,typing:true}})};
$('composeForm').onsubmit=async e=>{e.preventDefault();const content=$('messageInput').value.trim();if(!content||!currentChat)return;const {error}=await db.from('messages').insert({conversation_id:currentChat,sender_id:user.id,content});if(error)toast(error.message);else{$('messageInput').value='';loadMessages()}};
$('photoInput').onchange=async()=>{const file=$('photoInput').files[0];if(!file||!currentChat)return;if(file.size>5*1024*1024)return toast('Photo must be under 5 MB');if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type))return toast('Choose JPG, PNG, WEBP or GIF');const ext=file.name.split('.').pop().toLowerCase(),path=`${currentChat}/${user.id}/${crypto.randomUUID()}.${ext}`;const {error:up}=await db.storage.from('chat-photos').upload(path,file,{contentType:file.type});if(up)return toast(up.message);const {error}=await db.from('messages').insert({conversation_id:currentChat,sender_id:user.id,image_url:path,content:''});if(error)toast(error.message);else loadMessages();$('photoInput').value=''};
$('deleteChatBtn').onclick=()=>openModal('Delete entire chat','<p class="hint">This permanently deletes the conversation and all messages for both people. This cannot be undone.</p>',async()=>{if(!confirm('Delete the entire chat for both people?'))return;const {error}=await db.rpc('delete_conversation_for_everyone',{p_conversation_id:currentChat});if(error)throw error;if(channel)db.removeChannel(channel);currentChat=null;$('chatArea').classList.add('hidden');$('emptyState').classList.remove('hidden');$('app').classList.remove('chat-open');await loadPeople();toast('Chat deleted for both people')});
$('backBtn').onclick=()=>{$('app').classList.remove('chat-open')};
$('editProfile').onclick=()=>openModal('Edit profile',`<label class="hint">Display name</label><input id="newDisplay" class="field" maxlength="40" value="${esc(profile.display_name||'')}"><label class="hint">Username</label><input id="newUsername" class="field" maxlength="24" value="${esc(profile.username)}"><label class="hint">New email (optional)</label><input id="newEmail" class="field" type="email" placeholder="New email address"><label class="hint">Current password (required for email/password changes)</label><input id="currentPass" class="field" type="password" placeholder="Current password"><label class="hint">New password (optional)</label><input id="newPass" class="field" type="password" placeholder="At least 8 characters"><input id="confirmPass" class="field" type="password" placeholder="Confirm new password">`,async()=>{const display_name=$('newDisplay').value.trim(),username=$('newUsername').value.trim().toLowerCase(),email=$('newEmail').value.trim(),current_password=$('currentPass').value,new_password=$('newPass').value,confirm_password=$('confirmPass').value;if(!/^[a-z0-9_]{3,24}$/.test(username))throw Error('Username must be 3–24 letters, numbers or underscores');if(new_password&&(new_password.length<8||new_password!==confirm_password))throw Error('Check the new password and confirmation (minimum 8 characters)');const {error:pe}=await db.from('profiles').update({display_name,username}).eq('id',user.id);if(pe)throw pe;if(email||new_password){if(!current_password)throw Error('Enter your current password');const {error}=await db.functions.invoke('account-update',{body:{current_password,new_email:email||null,new_password:new_password||null}});if(error)throw error}await loadProfile();await loadPeople();toast('Profile updated')});
$('profilePhotoBtn').onclick=()=>{$('avatarFilePicker')?.remove();const f=document.createElement('input');f.type='file';f.accept='image/jpeg,image/png,image/webp';f.onchange=async()=>{const file=f.files[0];if(!file)return;if(file.size>5*1024*1024)return toast('Image must be under 5 MB');const ext=file.name.split('.').pop().toLowerCase(),path=`avatars/${user.id}/${crypto.randomUUID()}.${ext}`;const {error}=await db.storage.from('chat-photos').upload(path,file,{upsert:true,contentType:file.type});if(error)return toast(error.message);const {error:pe}=await db.from('profiles').update({avatar_url:path}).eq('id',user.id);if(pe)return toast(pe.message);await loadProfile();toast('Profile photo updated')};f.click()};
$('logoutBtn').onclick=async()=>{await db.auth.signOut();location.reload()};
async function startPresence(){const c=db.channel('presence-global',{config:{presence:{key:user.id}}});c.on('presence',{event:'sync'},()=>{}).subscribe(async status=>{if(status==='SUBSCRIBED')await c.track({online_at:new Date().toISOString()})})}
for(let i=0;i<9;i++){const h=document.createElement('span');h.className='heart';h.textContent='♡';h.style.left=(Math.random()*100)+'%';h.style.animationDuration=(12+Math.random()*13)+'s';h.style.animationDelay=(-Math.random()*20)+'s';h.style.fontSize=(12+Math.random()*20)+'px';$('floatHearts').appendChild(h)}
db.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){openModal('Set a new password','<input id="resetPass" class="field" type="password" placeholder="New password"><input id="resetPass2" class="field" type="password" placeholder="Confirm new password">',async()=>{const a=$('resetPass').value,b=$('resetPass2').value;if(a.length<8||a!==b)throw Error('Passwords must match and be at least 8 characters');const {error}=await db.auth.updateUser({password:a});if(error)throw error;toast('Password updated')})}});
startApp();
})();
</script></body></html>
