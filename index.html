(()=>{

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let user=null,profile=null,currentChat=null,peer=null;

function toast(msg){
 $('toast').textContent=msg;
 $('toast').classList.remove('hidden');
 clearTimeout(toast.timer);
 toast.timer=setTimeout(()=>$('toast').classList.add('hidden'),3500);
}

function setBusy(el,busy,label){
 if(!el)return;
 if(busy){
  if(!el.dataset.old)el.dataset.old=el.textContent;
  el.disabled=true;
  if(label)el.textContent=label;
 }else{
  el.disabled=false;
  el.textContent=el.dataset.old||el.textContent;
  delete el.dataset.old;
 }
}

function initials(p){
 return esc((p?.display_name||p?.username||'?').slice(0,1).toUpperCase());
}

function fallbackImage(img,p){
 const letter=(p?.display_name||p?.username||'?').slice(0,1).toUpperCase();
 img.onerror=null;
 img.src='data:image/svg+xml,'+encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" rx="40" fill="#71304f"/><text x="50%" y="56%" font-size="32" text-anchor="middle" fill="white">${letter}</text></svg>`
 );
}

function avatarHTML(p){
 return p?.avatar_url
  ?`<img class="avatar" data-avatar-path="${esc(p.avatar_url)}" data-avatar-letter="${initials(p)}" alt="">`
  :`<div class="avatar">${initials(p)}</div>`;
}

async function signedAsset(path){
 if(!path)return '';
 if(/^https?:\/\//i.test(path))return path;
 const {data,error}=await db.storage.from('chat-photos').createSignedUrl(path,3600);
 if(error){console.warn('Image URL:',error.message);return ''}
 return data?.signedUrl||'';
}

async function hydrateAvatars(root=document){
 for(const img of root.querySelectorAll('[data-avatar-path]')){
  const url=await signedAsset(img.dataset.avatarPath);
  if(url){
   img.onerror=()=>fallbackImage(img,{display_name:img.dataset.avatarLetter});
   img.src=url;
  }else{
   const d=document.createElement('div');
   d.className='avatar';
   d.textContent=img.dataset.avatarLetter||'?';
   img.replaceWith(d);
  }
 }
}

function enhancePasswordFields(root=document){
 root.querySelectorAll('input[type="password"]').forEach(input=>{
  if(input.closest('.password-wrap'))return;
  const wrap=document.createElement('div');
  wrap.className='password-wrap';
  input.parentNode.insertBefore(wrap,input);
  wrap.appendChild(input);
  const toggle=document.createElement('button');
  toggle.type='button';
  toggle.className='password-toggle';
  toggle.textContent='Show';
  toggle.onclick=()=>{
   const show=input.type==='password';
   input.type=show?'text':'password';
   toggle.textContent=show?'Hide':'Show';
  };
  wrap.appendChild(toggle);
 });
}
enhancePasswordFields();

 $('modalTitle').textContent=title;
 $('modalBody').innerHTML=body;
 enhancePasswordFields($('modalBody'));
 modalAction=action;
 $('modalSave').classList.remove('hidden');
 $('modalBg').classList.remove('hidden');

function closeModal(){
 $('modalBg').classList.add('hidden');
 modalAction=null;

$('modalCancel').onclick=closeModal;

$('modalSave').onclick=async()=>{

 setBusy(b,true,'Saving…');
 try{

function authMode(signup){
 isSignup=signup;
 $('authUsername').classList.toggle('hidden',!signup);
 $('authMain').textContent=signup?'Create account':'Log in';
 $('authSwitch').textContent=signup?'I already have an account':'Create account';
 $('forgotBtn').classList.toggle('hidden',signup);
 $('authMessage').textContent='';
}

$('authSwitch').onclick=()=>authMode(!isSignup);

$('authMain').onclick=async()=>{
 const email=$('authEmail').value.trim();
 const password=$('authPassword').value;
 const username=$('authUsername').value.trim().toLowerCase();

 if(!email||!password)return toast('Enter email and password');
 if(isSignup&&!/^[a-z0-9_]{3,24}$/.test(username))
  return toast('Username: 3–24 letters, numbers or underscores');

 const b=$('authMain');
 setBusy(b,true,'Please wait…');

 try{
  if(isSignup){
   const {data,error}=await db.auth.signUp({email,password});
   if(error)throw error;

   if(data.user){
    const {error:pe}=await db.from('profiles').upsert({
     id:data.user.id,
     username,
     display_name:username
    },{onConflict:'id'});

    if(pe)throw pe;
   }

   if(data.session){
    await startApp();

   }else{
    toast('Account created. You can now log in.');
    authMode(false);
   }
  }else{
   const {error}=await db.auth.signInWithPassword({email,password});
   if(error)throw error;

   await startApp();
  }
 }catch(e){
  console.error('Authentication:',e);
  toast(e.message||'Authentication failed');
 }finally{
  setBusy(b,false);
 }
};

async function loadPeople(){
 try{
  const {data:accepted,error:ae}=await db.from('friend_requests')
   .select('sender_id,receiver_id')
   .eq('status','accepted')
   .or(`sender_id.eq.${user.id},receiver_id.eq.${user.id}`);

  if(ae)throw ae;

  const friendIds=[...new Set((accepted||[]).map(r=>
   r.sender_id===user.id?r.receiver_id:r.sender_id
  ).filter(Boolean))];

  if(!friendIds.length){
   window.__onlyUsPeople=[];
   window.__onlyUsFriendChats={};
   $('peopleList').innerHTML='<div class="hint" style="padding:10px">No friends yet. Search for a username above.</div>';
   return;
  }

  const {data:profiles,error:pe}=await db.from('profiles')
   .select('id,username,display_name,avatar_url,last_seen_at')
   .in('id',friendIds);

  if(pe)throw pe;

  const {data:myRows,error:me}=await db.from('conversation_members')
   .select('conversation_id')
   .eq('user_id',user.id);

  if(me)throw me;

  const myIds=[...new Set((myRows||[]).map(x=>x.conversation_id))];
  let peerRows=[];

  if(myIds.length){
   const {data,error}=await db.from('conversation_members')
    .select('conversation_id,user_id')
    .in('conversation_id',myIds)
    .in('user_id',friendIds);

   if(error)throw error;
   peerRows=data||[];
  }

  const shared={};

  peerRows.forEach(r=>{
   if(!shared[r.user_id])shared[r.user_id]=[];
   if(!shared[r.user_id].includes(r.conversation_id))
    shared[r.user_id].push(r.conversation_id);
  });

  const allIds=[...new Set(Object.values(shared).flat())];
  let latest={};

  if(allIds.length){
   const {data:msgs,error}=await db.from('messages')
    .select('conversation_id,created_at')
    .in('conversation_id',allIds)
    .order('created_at',{ascending:false});

   if(!error){
    (msgs||[]).forEach(m=>{
     if(!latest[m.conversation_id])latest[m.conversation_id]=m.created_at;
    });
   }
  }

  const {data:hidden,error:he}=await db.from('hidden_conversations')
   .select('conversation_id')
   .eq('user_id',user.id);

  if(he)throw he;

  const hiddenIds=new Set((hidden||[]).map(x=>x.conversation_id));
  const friendChats={};

  (profiles||[]).forEach(p=>{
   const chats=shared[p.id]||[];
   if(!chats.length)return;

   chats.sort((a,b)=>
    new Date(latest[b]||0)-new Date(latest[a]||0)
   );

   const chosen=chats.find(id=>!hiddenIds.has(id))||chats[0];

   friendChats[p.id]={
    ...p,
    conversation_id:chosen,
    isHidden:hiddenIds.has(chosen)
   };
  });

  window.__onlyUsFriendChats=friendChats;
  window.__onlyUsPeople=Object.values(friendChats).filter(p=>!p.isHidden);

  $('peopleList').innerHTML=window.__onlyUsPeople.map(p=>`
   <div class="person" data-chat="${esc(p.conversation_id)}" data-peer="${esc(p.id)}">
    ${avatarHTML(p)}
    <div class="person-info">
     <b>${esc(p.display_name||p.username||'Friend')}</b>
     <small>@${esc(p.username||'username')} · <span data-person-status="${esc(p.id)}">Last seen recently</span></small>
    </div>
    <button type="button" class="friend-remove-btn" data-remove-friend="${esc(p.id)}" title="Remove friend">×</button>
   </div>
  `).join('')||'<div class="hint" style="padding:10px">No visible chats. Search for a friend to reopen a hidden chat.</div>';

  await hydrateAvatars($('peopleList'));
  refreshPresenceLabels();

 }catch(error){
  console.error('loadPeople:',error);
  $('peopleList').innerHTML=`<div class="hint" style="padding:10px">Could not load friends: ${esc(error.message)}</div>`;
  throw error;
 }
}

 const {data,error}=await db.from('friend_requests')

 if(error){

 $('requestsList').innerHTML=(data||[]).map(r=>`

async function searchUsers(){
 if(!user)return;

 const q=$('userSearch').value.trim().toLowerCase();

 if(q.length<2){
  await loadPeople();
  return;
 }

 const {data,error}=await db.from('profiles')
  .select('id,username,display_name,avatar_url')
  .ilike('username',q+'%')
  .neq('id',user.id)
  .limit(10);

 if(error)return toast(error.message);

 const {data:relations,error:re}=await db.from('friend_requests')
  .select('sender_id,receiver_id,status')
  .or(`sender_id.eq.${user.id},receiver_id.eq.${user.id}`);

 if(re)return toast(re.message);

 $('peopleList').innerHTML=(data||[]).map(p=>{
  const existing=window.__onlyUsFriendChats?.[p.id];

  const relation=(relations||[]).find(r=>
   (r.sender_id===user.id&&r.receiver_id===p.id)||
   (r.sender_id===p.id&&r.receiver_id===user.id)
  );

  const action=existing
   ?`<button class="icon-btn search-open" data-chat="${esc(existing.conversation_id)}" data-id="${esc(p.id)}">Open</button>`
   :relation?.status==='accepted'
   ?`<button class="icon-btn start-friend-chat" data-id="${esc(p.id)}">Open chat</button>`
   :relation?.status==='pending'
   ?'<span class="hint">Pending</span>'
   :`<button class="icon-btn add-friend" data-id="${esc(p.id)}">＋</button>`;

  return `
   <div class="person">
    ${avatarHTML(p)}
    <div class="person-info">
     <b>${esc(p.display_name||p.username)}</b>
     <small>@${esc(p.username)}</small>
    </div>
    ${action}
   </div>
  `;
 }).join('')||'<div class="hint" style="padding:10px">No users found.</div>';

 await hydrateAvatars($('peopleList'));

 document.querySelectorAll('.search-open').forEach(b=>
  b.onclick=()=>openChat(b.dataset.chat,b.dataset.id)
 );

 document.querySelectorAll('.start-friend-chat').forEach(b=>b.onclick=async()=>{
  setBusy(b,true,'Opening…');

  const {data,error}=await db.rpc('get_or_create_friend_conversation',{
   p_friend_id:b.dataset.id
  });

  if(error){
   setBusy(b,false);
   return toast(error.message);
  }

  await loadPeople();
  await openChat(data,b.dataset.id);
 });

 document.querySelectorAll('.add-friend').forEach(b=>b.onclick=async()=>{
  setBusy(b,true,'…');

  const {error}=await db.from('friend_requests').insert({
   sender_id:user.id,
   receiver_id:b.dataset.id,
   status:'pending'
  });

  if(error){
   setBusy(b,false);
   toast(error.message);
  }else{
   toast('Friend request sent');
   await searchUsers();
  }
 });
}

async function openChat(chatId,peerId){
 const {error:unhideError}=await db.rpc('unhide_conversation_for_me',{
  p_conversation_id:chatId
 });

 if(unhideError)return toast(unhideError.message);

 const {data:p,error}=await db.from('profiles')
  .select('*').eq('id',peerId).single();

 if(error)return toast(error.message);

 currentChat=chatId;
 peer=p;

 $('emptyState').classList.add('hidden');
 $('chatArea').classList.remove('hidden');
 $('app').classList.add('chat-open');

 $('peerName').textContent=p.display_name||p.username;
 $('peerStatus').textContent='Checking status…';

 const url=await signedAsset(p.avatar_url);

 if(url){
  $('peerAvatar').onerror=()=>fallbackImage($('peerAvatar'),p);
  $('peerAvatar').src=url;
 }else{
  fallbackImage($('peerAvatar'),p);
 }

 await loadMessages();
 subscribeChat();
 refreshPresenceLabels();
}

async function loadMessages(){
 if(!currentChat||!user)return;

 const chatAtStart=currentChat;

 const {data,error}=await db.from('messages')
  .select('id,conversation_id,sender_id,content,image_url,created_at,seen_at,deleted_at')
  .eq('conversation_id',chatAtStart)
  .order('created_at',{ascending:true});

 if(error){
  console.error('Messages:',error);
  toast(error.message);
  return;
 }

 const ids=(data||[]).map(m=>m.id);
 let hidden=new Set();

 if(ids.length){
  const {data:h,error:hideError}=await db.from('message_hidden')
   .select('message_id')
   .eq('user_id',user.id)
   .in('message_id',ids);

  if(!hideError)hidden=new Set((h||[]).map(x=>x.message_id));
 }

 const visible=(data||[]).filter(m=>!hidden.has(m.id));
 const visibleIds=visible.map(m=>m.id);
 let reactionMap={};

 if(visibleIds.length){
  const {data:rx,error:rxError}=await db.from('message_reactions')
   .select('message_id,user_id,emoji')
   .in('message_id',visibleIds);

  if(!rxError){
   (rx||[]).forEach(r=>{
    (reactionMap[r.message_id]??=[]).push(r);
   });
  }
 }

 const hydrated=await Promise.all(visible.map(async m=>{
  if(m.image_url&&!m.image_url.startsWith('http')){
   const url=await signedAsset(m.image_url);
   return {...m,image_url:url};
  }
  return m;
 }));

 if(currentChat!==chatAtStart)return;

 $('messages').innerHTML=hydrated.map(m=>
  renderMessage(m,reactionMap[m.id]||[])
 ).join('');

 $('messages').scrollTop=$('messages').scrollHeight;

 const unread=visible.filter(m=>
  m.sender_id!==user.id&&!m.seen_at&&!m.deleted_at
 ).map(m=>m.id);

 if(unread.length){
  const {error:seenError}=await db.from('messages')
   .update({seen_at:new Date().toISOString()})
   .in('id',unread);

  if(seenError)console.warn('Seen update:',seenError.message);
 }
}

function renderMessage(m,reactions=[]){
 const mine=m.sender_id===user.id;
 const deleted=!!m.deleted_at;
 const time=new Date(m.created_at).toLocaleTimeString([],{
  hour:'2-digit',minute:'2-digit'
 });

 const emojiOnly=!!m.content&&/^[\p{Extended_Pictographic}\uFE0F\u200D\s]+$/u.test(m.content);

 const messageText=m.content
  ?(emojiOnly
    ?`<span class="emoji-message">${esc(m.content)}</span>`
    :esc(m.content).replace(/\n/g,'<br>'))
  :'';

 const content=deleted
  ?'<div class="bubble deleted">This message was deleted</div>'
  :`<div class="bubble">${m.image_url?`<img src="${esc(m.image_url)}" alt="Shared photo">`:''}${messageText}</div>`;

 const grouped={};

 reactions.forEach(r=>{
  grouped[r.emoji]??={count:0,mine:false};
  grouped[r.emoji].count++;
  if(r.user_id===user.id)grouped[r.emoji].mine=true;
 });

 const reactionHTML=Object.entries(grouped).map(([emoji,v])=>
  `<button type="button" class="reaction-chip ${v.mine?'mine':''}" data-react-msg="${esc(m.id)}" data-emoji="${esc(emoji)}">${emoji} ${v.count}</button>`
 ).join('');

 return `
  <div class="message ${mine?'mine':''}" data-message="${esc(m.id)}" data-deleted="${deleted}">
   ${content}
   ${reactionHTML?`<div class="reaction-row">${reactionHTML}</div>`:''}
   <div class="msg-foot">
    <span>${time}</span>
    ${mine&&!deleted?`<span>${m.seen_at?'Seen':'Sent'}</span>`:''}
    <button type="button" class="msg-menu" data-msgid="${esc(m.id)}" data-deleted="${deleted}">⋮</button>
   </div>
  </div>
 `;
}

/* MESSAGE MENU */

function closeMessageMenu(){
 if(messageMenu){
  messageMenu.remove();
  messageMenu=null;
 }
}

function showMessageMenu(id,deleted,x,y){
 closeMessageMenu();
 if(deleted)return;

 const menu=document.createElement('div');
 menu.className='message-menu-pop';

 menu.innerHTML=`
  <div class="reaction-picker">
   ${reactionChoices.map(e=>`<button type="button" data-pick-emoji="${esc(e)}">${e}</button>`).join('')}
  </div>
  <button type="button" class="menu-action" data-menu-action="delete-me">Delete for me</button>
  <button type="button" class="menu-action delete" data-menu-action="delete-all">Delete for everyone</button>
 `;

 document.body.appendChild(menu);
 messageMenu=menu;

 const w=menu.offsetWidth;
 const h=menu.offsetHeight;

 menu.style.left=Math.max(8,Math.min(x||20,innerWidth-w-8))+'px';
 menu.style.top=Math.max(8,Math.min(y||20,innerHeight-h-8))+'px';

 menu.addEventListener('click',async e=>{
  const react=e.target.closest('[data-pick-emoji]');
  const actionButton=e.target.closest('[data-menu-action]');

  if(!react&&!actionButton)return;

  e.preventDefault();
  e.stopPropagation();

  const buttons=[...menu.querySelectorAll('button')];
  buttons.forEach(b=>b.disabled=true);

  try{
   if(react){
    await toggleReaction(id,react.dataset.pickEmoji);
    closeMessageMenu();
    return;
   }

   const action=actionButton.dataset.menuAction;

   if(action==='delete-me'){
    actionButton.textContent='Deleting…';

    const {error}=await db.rpc('hide_message_for_me',{
     p_message_id:id
    });

    if(error)throw error;

    closeMessageMenu();
    await loadMessages();
    toast('Message deleted for you');
   }

   if(action==='delete-all'){
    if(!confirm('Delete this message for both people?')){
     buttons.forEach(b=>b.disabled=false);
     return;
    }

    actionButton.textContent='Deleting…';

    const {error}=await db.rpc('delete_message_for_everyone',{
     p_message_id:id
    });

    if(error)throw error;

    closeMessageMenu();
    await loadMessages();
    toast('Message deleted for everyone');
   }

  }catch(error){
   console.error('Message action:',error);
   toast(error.message||'Action failed');
   buttons.forEach(b=>b.disabled=false);
  }
 });
}

/* REACTIONS - DOES NOT REQUIRE AN ID COLUMN */

async function toggleReaction(messageId,emoji){
 try{
  const {data:existing,error:findError}=await db.from('message_reactions')
   .select('message_id')
   .eq('message_id',messageId)
   .eq('user_id',user.id)
   .eq('emoji',emoji)
   .limit(1);

  if(findError)throw findError;

  if(existing?.length){
   const {error}=await db.from('message_reactions')
    .delete()
    .eq('message_id',messageId)
    .eq('user_id',user.id)
    .eq('emoji',emoji);

   if(error)throw error;
  }else{
   const {error}=await db.from('message_reactions').insert({
    message_id:messageId,
    user_id:user.id,
    emoji
   });

   if(error)throw error;
  }

  await loadMessages();

 }catch(error){
  console.error('Reaction error:',error);
  toast(error.message||'Could not send reaction');
 }
}

$('messages').addEventListener('click',e=>{
 const chip=e.target.closest('[data-react-msg]');

 if(chip){
  e.preventDefault();
  e.stopPropagation();
  toggleReaction(chip.dataset.reactMsg,chip.dataset.emoji);
  return;
 }

 const b=e.target.closest('.msg-menu');

 if(b){
  e.preventDefault();
  e.stopPropagation();

  showMessageMenu(
   b.dataset.msgid,
   b.dataset.deleted==='true',
   e.clientX||innerWidth/2,
   e.clientY||innerHeight/2
  );
 }
});

$('messages').addEventListener('contextmenu',e=>{
 const msg=e.target.closest('.message');
 if(!msg)return;

 e.preventDefault();

 showMessageMenu(
  msg.dataset.message,
  msg.dataset.deleted==='true',
  e.clientX,e.clientY
 );
});

$('messages').addEventListener('pointerdown',e=>{
 const msg=e.target.closest('.message');
 if(!msg||e.target.closest('button'))return;

 clearTimeout(messageLongPressTimer);

 const id=msg.dataset.message;
 const deleted=msg.dataset.deleted==='true';
 const x=e.clientX,y=e.clientY;

 messageLongPressTimer=setTimeout(()=>{
  showMessageMenu(id,deleted,x||innerWidth/2,y||innerHeight/2);
 },550);
});

['pointerup','pointercancel','pointermove','scroll'].forEach(ev=>
 $('messages').addEventListener(ev,()=>{
  clearTimeout(messageLongPressTimer);
 },{passive:true})
);

document.addEventListener('click',e=>{
 if(messageMenu&&!e.target.closest('.message-menu-pop')&&!e.target.closest('.msg-menu')){
  closeMessageMenu();
 }
});

/* FRIEND REMOVAL */

function closeFriendMenu(){
 if(friendMenu){
  friendMenu.remove();
  friendMenu=null;
 }
}

async function removeFriend(peerId){
 const person=(window.__onlyUsFriendChats||{})[peerId];
 const name=person?.display_name||person?.username||'this friend';

 if(!confirm(`Remove ${name} from your friends? Existing messages will be preserved.`))return;

 const {error}=await db.rpc('remove_friend',{
  p_friend_id:peerId
 });

 if(error)return toast(error.message);

 if(peer?.id===peerId){
  currentChat=null;
  peer=null;

  if(channel)db.removeChannel(channel);
  if(typingChannel)db.removeChannel(typingChannel);

  channel=null;
  typingChannel=null;

  $('chatArea').classList.add('hidden');
  $('emptyState').classList.remove('hidden');
  $('app').classList.remove('chat-open');
 }

 await loadPeople();
 toast('Friend removed. Existing messages are preserved.');
}

$('peopleList').addEventListener('click',async e=>{
 const remove=e.target.closest('[data-remove-friend]');

 if(remove){
  e.preventDefault();
  e.stopPropagation();

  remove.disabled=true;
  await removeFriend(remove.dataset.removeFriend);
  remove.disabled=false;
  return;
 }

 if(friendLongPressTriggered){
  friendLongPressTriggered=false;
  e.preventDefault();
  return;
 }

 const row=e.target.closest('[data-chat]');

 if(row)openChat(row.dataset.chat,row.dataset.peer);
});

function showFriendMenu(peerId,x,y){
 closeFriendMenu();

 const menu=document.createElement('div');
 menu.className='friend-menu-pop';
 menu.innerHTML='<button type="button" class="menu-action delete">Remove Friend</button>';

 document.body.appendChild(menu);
 friendMenu=menu;

 menu.style.left=Math.max(8,Math.min(x,innerWidth-menu.offsetWidth-8))+'px';
 menu.style.top=Math.max(8,Math.min(y,innerHeight-menu.offsetHeight-8))+'px';

 menu.querySelector('button').onclick=async()=>{
  closeFriendMenu();
  await removeFriend(peerId);
 };
}

$('peopleList').addEventListener('contextmenu',e=>{
 const row=e.target.closest('[data-chat]');
 if(!row)return;

 e.preventDefault();
 showFriendMenu(row.dataset.peer,e.clientX,e.clientY);
});

$('peopleList').addEventListener('pointerdown',e=>{
 const row=e.target.closest('[data-chat]');
 if(!row||e.pointerType==='mouse')return;

 clearTimeout(longPressTimer);
 friendLongPressTriggered=false;

 const id=row.dataset.peer;
 const x=e.clientX,y=e.clientY;

 longPressTimer=setTimeout(()=>{
  friendLongPressTriggered=true;
  showFriendMenu(id,x,y);
 },600);
});

['pointerup','pointercancel','pointermove','scroll'].forEach(ev=>
 $('peopleList').addEventListener(ev,()=>{
  clearTimeout(longPressTimer);
 },{passive:true})
);

document.addEventListener('click',e=>{
 if(friendMenu&&!e.target.closest('.friend-menu-pop')){
  closeFriendMenu();
 }
});

/* REALTIME */

function subscribeChat(){
 if(channel)db.removeChannel(channel);

 const chatAtStart=currentChat;

 channel=db.channel('chat-'+chatAtStart)
  .on('postgres_changes',{
   event:'*',
   schema:'public',
   table:'messages',
   filter:'conversation_id=eq.'+chatAtStart
  },()=>{
   if(currentChat===chatAtStart)loadMessages();
  })
  .on('postgres_changes',{
   event:'*',
   schema:'public',
   table:'message_reactions'
  },()=>{
   if(currentChat===chatAtStart)loadMessages();
  })
  .subscribe();

 if(typingChannel)db.removeChannel(typingChannel);

 typingChannel=db.channel('typing-'+chatAtStart)
  .on('broadcast',{event:'typing'},({payload})=>{
   if(payload?.user_id===user.id)return;

   $('typingStatus').textContent=payload?.typing?'Typing…':'';

   clearTimeout(typingClearTimer);

   if(payload?.typing){
    typingClearTimer=setTimeout(()=>{
     $('typingStatus').textContent='';
    },2500);
   }
  }).subscribe();
}

function emitTyping(value){
 if(typingChannel){
  typingChannel.send({
   type:'broadcast',
   event:'typing',
   payload:{user_id:user.id,typing:value}
  });
 }
}

$('messageInput').oninput=()=>{
 emitTyping(true);
 clearTimeout(typingStopTimer);
 typingStopTimer=setTimeout(()=>emitTyping(false),1100);
};

$('messageInput').onblur=()=>{
 clearTimeout(typingStopTimer);
 emitTyping(false);
};

$('composeForm').onsubmit=async e=>{
 e.preventDefault();

 const content=$('messageInput').value.trim();
 if(!content||!currentChat)return;

 const sendButton=$('composeForm').querySelector('.send-btn');
 setBusy(sendButton,true,'…');

 emitTyping(false);
 clearTimeout(typingStopTimer);

 try{
  const {error}=await db.from('messages').insert({
   conversation_id:currentChat,
   sender_id:user.id,
   content
  });

  if(error)throw error;

  $('messageInput').value='';
  await loadMessages();

 }catch(error){
  toast(error.message||'Message could not be sent');
 }finally{
  setBusy(sendButton,false);
 }
};

/* CHAT PHOTO UPLOAD */

$('photoInput').onchange=async()=>{
 const file=$('photoInput').files[0];
 if(!file||!currentChat)return;

 if(file.size>5*1024*1024){
  $('photoInput').value='';
  return toast('Photo must be under 5 MB');
 }

 if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type)){
  $('photoInput').value='';
  return toast('Choose JPG, PNG, WEBP or GIF');
 }

 const chatAtStart=currentChat;
 const ext=file.name.split('.').pop().toLowerCase();
 const path=`${chatAtStart}/${user.id}/${crypto.randomUUID()}.${ext}`;

 try{
  const {error:up}=await db.storage.from('chat-photos').upload(path,file,{
   contentType:file.type
  });

  if(up)throw up;

  const {error}=await db.from('messages').insert({
   conversation_id:chatAtStart,
   sender_id:user.id,
   image_url:path,
   content:''
  });

  if(error)throw error;

  if(currentChat===chatAtStart)await loadMessages();
  toast('Photo sent');

 }catch(error){
  console.error('Photo upload:',error);
  toast(error.message||'Photo upload failed');
 }finally{
  $('photoInput').value='';
 }
};

/* HIDE CHAT */

$('deleteChatBtn').onclick=()=>openModal(
 'Hide this chat',
 '<p class="hint">This removes the conversation from your chat list only. The other person will still have the conversation and messages. You can reopen it by searching for the friend.</p>',
 async()=>{
  const chatToHide=currentChat;

  const {error}=await db.rpc('hide_conversation_for_me',{
   p_conversation_id:chatToHide
  });

  if(error)throw error;

  if(channel)db.removeChannel(channel);
  if(typingChannel)db.removeChannel(typingChannel);

  channel=null;
  typingChannel=null;
  currentChat=null;
  peer=null;

  $('chatArea').classList.add('hidden');
  $('emptyState').classList.remove('hidden');
  $('app').classList.remove('chat-open');

  await loadPeople();
  toast('Chat hidden from your list');
 }
);

$('backBtn').onclick=()=>$('app').classList.remove('chat-open');

/* PROFILE EDIT */

$('editProfile').onclick=()=>openModal(
 'Edit profile',
 `<label class="hint">Display name</label>
 <input id="newDisplay" class="field" maxlength="40" value="${esc(profile.display_name||'')}">

 <label class="hint">Username</label>
 <input id="newUsername" class="field" maxlength="24" value="${esc(profile.username)}">

 <label class="hint">New email (optional)</label>
 <input id="newEmail" class="field" type="email" placeholder="New email address">

 <label class="hint">Current password</label>
 <input id="currentPass" class="field" type="password" placeholder="Current password">

 <label class="hint">New password</label>
 <input id="newPass" class="field" type="password" placeholder="At least 8 characters">

 <input id="confirmPass" class="field" type="password" placeholder="Confirm new password">`,
 async()=>{
  const display_name=$('newDisplay').value.trim();
  const username=$('newUsername').value.trim().toLowerCase();
  const email=$('newEmail').value.trim();
  const current_password=$('currentPass').value;
  const new_password=$('newPass').value;
  const confirm_password=$('confirmPass').value;

  if(!/^[a-z0-9_]{3,24}$/.test(username)){
   throw Error('Username must be 3–24 letters, numbers or underscores');
  }

  if(new_password&&(new_password.length<8||new_password!==confirm_password)){
   throw Error('Check the new password and confirmation');
  }

  const {error:pe}=await db.from('profiles')
   .update({display_name,username})
   .eq('id',user.id);

  if(pe)throw pe;

  if(email||new_password){
   if(!current_password)throw Error('Enter your current password');

   const {error}=await db.functions.invoke('account-update',{
    body:{
     current_password,
     new_email:email||null,
     new_password:new_password||null
    }
   });

   if(error)throw error;
  }

  await loadProfile();
  await loadPeople();
  toast('Profile updated');
 }
);

/* PROFILE PHOTO */

$('profilePhotoBtn').onclick=()=>{
 const f=document.createElement('input');
 f.type='file';
 f.accept='image/jpeg,image/png,image/webp';

 f.onchange=async()=>{
  const file=f.files[0];
  if(!file)return;

  if(file.size>5*1024*1024)return toast('Image must be under 5 MB');

  if(!/^image\/(jpeg|png|webp)$/.test(file.type)){
   return toast('Choose JPG, PNG or WEBP');
  }

  const ext=file.name.split('.').pop().toLowerCase();
  const path=`avatars/${user.id}/${crypto.randomUUID()}.${ext}`;

  try{
   const {error}=await db.storage.from('chat-photos').upload(path,file,{
    upsert:true,
    contentType:file.type
   });

   if(error)throw error;

   const {error:pe}=await db.from('profiles')
    .update({avatar_url:path})
    .eq('id',user.id);

   if(pe)throw pe;

   await loadProfile();
   await loadPeople();

   toast('Profile photo updated');

  }catch(error){
   console.error('Avatar upload:',error);
   toast(error.message||'Profile photo upload failed');
  }
 };

 f.click();
};

/* LOGOUT */

$('logoutBtn').onclick=async()=>{
 try{
  if(user){
   await db.from('profiles')
    .update({last_seen_at:new Date().toISOString()})
    .eq('id',user.id);
  }

  if(presenceChannel){
   await presenceChannel.untrack();
   await db.removeChannel(presenceChannel);
  }

  if(channel)await db.removeChannel(channel);
  if(typingChannel)await db.removeChannel(typingChannel);

  await db.auth.signOut();

 }catch(error){
  toast(error.message||'Logout failed');
 }
};

/* PRESENCE */

function onlineUserIds(){
 const state=presenceChannel?.presenceState?.()||{};
 const ids=new Set();

 Object.entries(state).forEach(([key,metas])=>
  (metas||[]).forEach(meta=>ids.add(meta.user_id||key))
 );

 return ids;
}

function relativeSeen(value){
 if(!value)return 'Last seen recently';

 const secs=Math.max(0,Math.floor((Date.now()-new Date(value).getTime())/1000));

 if(secs<60)return 'Seen now';
 if(secs<3600)return `Seen ${Math.floor(secs/60)}m ago`;
 if(secs<86400)return `Seen ${Math.floor(secs/3600)}h ago`;

 return `Seen ${Math.floor(secs/86400)}d ago`;
}

function refreshPresenceLabels(){
 const online=onlineUserIds();

 document.querySelectorAll('[data-person-status]').forEach(el=>{
  const p=(window.__onlyUsPeople||[]).find(x=>x.id===el.dataset.personStatus);

  el.textContent=online.has(el.dataset.personStatus)
   ?'Online'
   :relativeSeen(p?.last_seen_at);
 });

 if(peer){
  $('peerStatus').textContent=online.has(peer.id)
   ?'Online'
   :relativeSeen(peer.last_seen_at);
 }
}

async function startPresence(){
 if(presenceChannel){
  await db.removeChannel(presenceChannel);
 }

 presenceChannel=db.channel('presence-global',{
  config:{presence:{key:user.id}}
 });

 presenceChannel
  .on('presence',{event:'sync'},refreshPresenceLabels)
  .on('presence',{event:'join'},refreshPresenceLabels)
  .on('presence',{event:'leave'},refreshPresenceLabels);

 presenceChannel.subscribe(async status=>{
  if(status==='SUBSCRIBED'){
   await presenceChannel.track({
    user_id:user.id,
    online_at:new Date().toISOString()
   });

   refreshPresenceLabels();
  }
 });

 if(statusRefreshTimer)clearInterval(statusRefreshTimer);

 statusRefreshTimer=setInterval(()=>{
  refreshPresenceLabels();
  if(currentChat)loadMessages();
 },15000);

 if(!presenceListenerAdded){
  presenceListenerAdded=true;

  document.addEventListener('visibilitychange',async()=>{
   if(!user)return;

   if(document.visibilityState==='hidden'){
    await db.from('profiles')
     .update({last_seen_at:new Date().toISOString()})
     .eq('id',user.id);

    if(presenceChannel)await presenceChannel.untrack();

   }else if(presenceChannel){
    await presenceChannel.track({
     user_id:user.id,
     online_at:new Date().toISOString()
    });

    await db.from('profiles')
     .update({last_seen_at:new Date().toISOString()})
     .eq('id',user.id);
   }
  });
 }
}

/* AUTH STATE CHANGES */

db.auth.onAuthStateChange((event,session)=>{
 if(event==='SIGNED_IN'||event==='INITIAL_SESSION'){
  setTimeout(()=>{
   if(session?.user)startApp();
  },0);
 }

 if(event==='SIGNED_OUT'){
  setTimeout(()=>{
   user=null;
   profile=null;
   currentChat=null;
   peer=null;

   if(channel)db.removeChannel(channel);
   if(typingChannel)db.removeChannel(typingChannel);
   if(presenceChannel)db.removeChannel(presenceChannel);

   channel=null;
   typingChannel=null;
   presenceChannel=null;

   if(statusRefreshTimer)clearInterval(statusRefreshTimer);

   $('app').classList.add('hidden');
   $('app').classList.remove('chat-open');
   $('authView').classList.remove('hidden');
  },0);
 }

 if(event==='PASSWORD_RECOVERY'){
  setTimeout(()=>{
   openModal(
    'Set a new password',
    '<input id="resetPass" class="field" type="password" placeholder="New password"><input id="resetPass2" class="field" type="password" placeholder="Confirm new password">',
    async()=>{
     const a=$('resetPass').value;
     const b=$('resetPass2').value;

     if(a.length<8||a!==b){
      throw Error('Passwords must match and be at least 8 characters');
     }

     const {error}=await db.auth.updateUser({password:a});
     if(error)throw error;

     toast('Password updated');
    }
   );
  },0);
 }
});

/* INITIAL SESSION CHECK */

startApp();

})();
</script>
